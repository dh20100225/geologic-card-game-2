<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여름의 고시엔 3D 고교야구 시뮬레이터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 with unpkg fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            onerror="var s=document.createElement('script');s.src='https://unpkg.com/three@0.128.0/build/three.min.js';document.head.appendChild(s);"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Noto Sans KR', sans-serif;
            background: #1e3a8a;
        }
        .font-display {
            font-family: 'Black Han Sans', sans-serif;
            letter-spacing: 0.02em;
        }
        #three-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        @keyframes promptPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        .animate-prompt {
            animation: promptPulse 1.5s ease-in-out infinite;
        }
        @keyframes judgePop {
            0% { transform: translate(-50%, -45%) scale(0.5); opacity: 0; }
            18% { transform: translate(-50%, -68%) scale(1.16); opacity: 1; }
            82% { transform: translate(-50%, -88%) scale(1.0); opacity: 1; }
            100% { transform: translate(-50%, -108%) scale(0.95); opacity: 0; }
        }
        .animate-judge {
            animation: judgePop 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes nextBtnPop {
            0% { transform: translate(-50%, 24px) scale(0.85); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }
        .animate-next-btn {
            animation: nextBtnPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-sky-500">

    <!-- ==================== FULL-VIEWPORT 3D KOSHIEN STADIUM ==================== -->
    <div id="canvas-wrapper" class="relative w-full h-full cursor-pointer">
        <canvas id="three-canvas"></canvas>

        <!-- WebGL Error Fallback -->
        <div id="webgl-error-box" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-50">
            <div class="text-4xl mb-2">⚠️</div>
            <div class="font-bold text-lg text-amber-300 mb-1">3D 그래픽 초기화 오류</div>
            <p id="webgl-error-msg" class="text-xs text-slate-300 max-w-md">브라우저의 WebGL 설정을 확인해 주세요.</p>
        </div>

        <!-- ==================== TOP ARCADE-SIM HUD OVERLAY ==================== -->
        <div class="pointer-events-none absolute inset-x-0 top-0 z-20 flex flex-col items-center pt-2.5 sm:pt-4 px-2.5 sm:px-5">
            <!-- Top Row: Left Stats/Controls | Center Live Distance | Right Pitch Selector Pills -->
            <div class="w-full max-w-7xl flex flex-wrap items-start justify-between gap-2">

                <!-- LEFT: Best Distance Pill + Home Run / Hit Stats + Utility Buttons -->
                <div class="pointer-events-auto flex flex-col gap-1.5">
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-950/80 backdrop-blur-md border border-white/25 shadow-lg">
                            <span class="text-xs sm:text-sm font-extrabold text-amber-300">Best:</span>
                            <span id="hud-best-distance" class="text-sm sm:text-base font-black text-white tabular-nums">0.00m</span>
                        </div>

                        <button id="customize-btn" type="button" title="학교 유니폼 & 배트 설정"
                            class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-sky-500/90 hover:bg-sky-400 border-2 border-white/80 flex items-center justify-center text-white text-sm sm:text-base shadow-lg transition cursor-pointer">
                            🏠
                        </button>
                        <button id="mute-btn" type="button" title="사운드 켜기/끄기"
                            class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-950/80 hover:bg-slate-800 backdrop-blur-md border border-white/25 flex items-center justify-center text-white text-sm sm:text-base shadow-lg transition cursor-pointer">
                            <span id="mute-icon">🔊</span>
                        </button>
                    </div>

                    <!-- Home Run & Hit Counter Pill -->
                    <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-950/70 backdrop-blur-md border border-white/15 text-[11px] sm:text-xs font-bold text-slate-200 self-start shadow">
                        <span id="hud-school-dot" class="w-2.5 h-2.5 rounded-full bg-blue-500 border border-white"></span>
                        <span id="hud-school-name" class="font-extrabold text-white">세이도 고교</span>
                        <span class="text-white/30">|</span>
                        <span class="text-amber-300 font-extrabold">홈런 <span id="hud-hr-count">0</span></span>
                        <span class="text-sky-300 font-extrabold">안타 <span id="hud-hit-count">0</span></span>
                    </div>
                </div>

                <!-- RIGHT: Pitch Type Selector Pills (랜덤 실전 + 6 Pitch Types) -->
                <div class="pointer-events-auto flex flex-wrap justify-end gap-1 sm:gap-1.5 max-w-[230px] sm:max-w-md">
                    <button type="button" data-pitch="random"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-amber-400 text-slate-950 font-black text-[11px] sm:text-xs shadow-md border border-white/70 transition cursor-pointer">
                        🎲 랜덤 실전
                    </button>
                    <button type="button" data-pitch="four_seam"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer">
                        직구
                    </button>
                    <button type="button" data-pitch="two_seam"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer">
                        투심
                    </button>
                    <button type="button" data-pitch="slider"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer">
                        슬라이더
                    </button>
                    <button type="button" data-pitch="curve"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer">
                        커브
                    </button>
                    <button type="button" data-pitch="fork"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer">
                        포크볼
                    </button>
                    <button type="button" data-pitch="changeup"
                        class="pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer">
                        체인지업
                    </button>
                </div>
            </div>

            <!-- CENTER TOP: Live Distance Counter (`0.00m`) + Pitch / Hit Telemetry Callout Pill -->
            <div class="mt-1 sm:mt-0.5 flex flex-col items-center">
                <div id="hud-live-distance"
                    class="font-black text-4xl sm:text-6xl md:text-7xl text-slate-950 drop-shadow-[0_2px_10px_rgba(255,255,255,0.92)] tabular-nums tracking-tight leading-none">
                    0.00m
                </div>
                <div id="hud-callout-pill"
                    class="mt-1.5 px-3.5 py-1 rounded-full bg-slate-950/82 backdrop-blur-md border border-sky-300/60 text-xs sm:text-sm font-extrabold text-sky-300 shadow-lg">
                    <span id="hud-callout-text">상대 에이스 투수 등판 준비 완료</span>
                </div>
            </div>
        </div>

        <!-- ==================== CENTER PLATE PROMPT ("Tap to Start!" / "Tap to Swing!") ==================== -->
        <div id="center-prompt" class="pointer-events-none absolute left-1/2 top-[67%] z-20 animate-prompt text-center">
            <div id="center-prompt-main"
                class="font-black text-2xl sm:text-4xl text-white drop-shadow-[0_3px_10px_rgba(0,0,0,0.95)] whitespace-nowrap">
                Tap to Start!
            </div>
            <div id="center-prompt-sub"
                class="mt-1 inline-block px-3 py-0.5 rounded-full bg-slate-950/75 text-amber-300 border border-white/20 text-[11px] sm:text-xs font-bold backdrop-blur-sm">
                화면 클릭 / 터치 / SPACEBAR
            </div>
        </div>

        <!-- ==================== SWING CONTACT JUDGMENT POPUP ==================== -->
        <div id="judgment-popup" class="hidden pointer-events-none absolute left-1/2 top-[43%] z-30 text-center">
            <div id="judgment-title" class="font-display text-4xl sm:text-6xl text-amber-300 drop-shadow-[0_4px_14px_rgba(0,0,0,0.95)] whitespace-nowrap">
                PERFECT!!
            </div>
            <div id="judgment-sub" class="mt-1 px-3.5 py-0.5 rounded-full bg-slate-950/85 text-white text-xs sm:text-sm font-bold inline-block border border-white/20">
                완벽한 스윗스팟 홈런 타구!
            </div>
        </div>

        <!-- ==================== BOTTOM-CENTER "Next" BUTTON ==================== -->
        <button id="next-btn" type="button"
            class="hidden absolute bottom-8 sm:bottom-11 left-1/2 -translate-x-1/2 z-30 px-12 sm:px-16 py-3.5 sm:py-4 rounded-2xl bg-gradient-to-b from-sky-500 to-blue-700 hover:from-sky-400 hover:to-blue-600 border-2 border-slate-950/80 text-white font-black text-2xl sm:text-3xl shadow-[0_8px_24px_rgba(0,0,0,0.5)] active:scale-95 transition cursor-pointer">
            Next
        </button>
    </div>

    <!-- ==================== SCHOOL & BAT CUSTOMIZATION MODAL ==================== -->
    <div id="customize-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 shadow-2xl text-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-display text-2xl text-amber-300">⚾ 고시엔 타자 &amp; 배트 설정</h2>
                <button id="close-modal-btn" type="button" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-bold text-white cursor-pointer">닫기 ✕</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1.5">학교 이름 &amp; 모자 이니셜</label>
                    <input id="school-name-input" type="text" maxlength="10" value="세이도 고교"
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-600 text-white font-bold focus:outline-none focus:border-amber-400">
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <button type="button" data-preset="세이도 고교" data-emblem="S" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-sky-300 font-bold cursor-pointer">세이도 고교</button>
                        <button type="button" data-preset="메이세이 고교" data-emblem="星" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-sky-300 font-bold cursor-pointer">메이세이 고교</button>
                        <button type="button" data-preset="쇼호쿠 고교" data-emblem="龍" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-sky-300 font-bold cursor-pointer">쇼호쿠 고교</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1.5">유니폼 &amp; 알프스 응원단 컬러</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button type="button" data-color="#2563eb" class="color-btn h-9 rounded-xl bg-blue-600 ring-2 ring-white scale-105 transition cursor-pointer"></button>
                        <button type="button" data-color="#dc2626" class="color-btn h-9 rounded-xl bg-red-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                        <button type="button" data-color="#059669" class="color-btn h-9 rounded-xl bg-emerald-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                        <button type="button" data-color="#ea580c" class="color-btn h-9 rounded-xl bg-orange-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                        <button type="button" data-color="#7c3aed" class="color-btn h-9 rounded-xl bg-violet-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1.5">배트 타입 선택</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" data-bat="metal" class="bat-btn p-2.5 rounded-xl border-2 border-amber-400 bg-amber-400/15 text-left transition cursor-pointer">
                            <div class="font-extrabold text-xs sm:text-sm text-white">⚡ 고시엔 금속배트</div>
                            <div class="text-[11px] text-amber-300">경쾌한 "깡!" 반발력</div>
                        </button>
                        <button type="button" data-bat="wood" class="bat-btn p-2.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:border-slate-500 text-left transition cursor-pointer">
                            <div class="font-extrabold text-xs sm:text-sm text-white">🪵 프로 나무배트</div>
                            <div class="text-[11px] text-slate-300">묵직한 장타 스윗스팟</div>
                        </button>
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                    <button id="reset-best-btn" type="button" class="px-3 py-2 rounded-xl bg-rose-950/70 hover:bg-rose-900 border border-rose-700/60 text-xs font-bold text-rose-300 cursor-pointer">
                        기록 초기화
                    </button>
                    <button id="apply-modal-btn" type="button" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-sm shadow-lg cursor-pointer">
                        적용하고 돌아가기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. PROCEDURAL WEB AUDIO SYNTHESIZER (NO EXTERNAL SOUND URLS)
         * ============================================================================
         */
        class KoshienAudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            ensureCtx() {
                if (this.muted) return null;
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume().catch(() => {});
                    }
                } catch (e) {
                    this.ctx = null;
                }
                return this.ctx;
            }
            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
            playPitchRelease() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(210, now);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.09);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }
            playSwingWhoosh() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            playCatcherMittPop() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(175, now);
                osc.frequency.exponentialRampToValueAtTime(44, now + 0.11);
                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            }
            playBatHit(quality = 1.0, isWood = false) {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                if (isWood) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300 + quality * 150, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.17);
                    gain.gain.setValueAtTime(0.40 * (0.6 + quality * 0.4), now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.20);
                } else {
                    // Authentic Koshien Aluminum Bat "KANG!" harmonic ring
                    [1380, 2760, 4140].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = idx === 0 ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(freq * (0.95 + quality * 0.08), now);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.86, now + 0.38);
                        gain.gain.setValueAtTime((0.32 / (idx + 1)) * (0.55 + quality * 0.55), now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.41);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.43);
                    });
                }
            }
            playSkyWind(duration = 1.15) {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const bufferSize = Math.floor(ctx.sampleRate * duration);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(420, now);
                filter.frequency.linearRampToValueAtTime(820, now + duration * 0.5);
                filter.Q.setValueAtTime(1.4, now);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.005, now);
                gain.gain.linearRampToValueAtTime(0.095, now + duration * 0.3);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);
            }
            playHomeRunCelebration() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;

                // 1. Koshien Siren
                const siren = ctx.createOscillator();
                const sGain = ctx.createGain();
                siren.type = 'sawtooth';
                siren.frequency.setValueAtTime(260, now);
                siren.frequency.linearRampToValueAtTime(545, now + 0.5);
                siren.frequency.linearRampToValueAtTime(475, now + 1.25);
                sGain.gain.setValueAtTime(0.001, now);
                sGain.gain.linearRampToValueAtTime(0.085, now + 0.25);
                sGain.gain.exponentialRampToValueAtTime(0.001, now + 1.38);
                siren.connect(sGain);
                sGain.connect(ctx.destination);
                siren.start(now);
                siren.stop(now + 1.42);

                // 2. Brass Fanfare
                [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    const lp = ctx.createBiquadFilter();
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(2200, now);

                    osc.frequency.setValueAtTime(freq, now + i * 0.095);
                    gain.gain.setValueAtTime(0.08, now + i * 0.095);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.095 + 0.32);
                    osc.connect(lp);
                    lp.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.095);
                    osc.stop(now + i * 0.095 + 0.34);
                });

                // 3. Crowd Applause
                const dur = 1.95;
                const bufSize = Math.floor(ctx.sampleRate * dur);
                const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const bp = ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.setValueAtTime(840, now);
                bp.Q.setValueAtTime(0.7, now);
                const nGain = ctx.createGain();
                nGain.gain.setValueAtTime(0.01, now);
                nGain.gain.linearRampToValueAtTime(0.21, now + 0.2);
                nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                src.connect(bp);

            const ivyTex = createIvyWallWithSponsorsTexture();
            const wallGeo = new THREE.BufferGeometry();
            const positions = [];
            const uvs = [];
            const indices = [];
            const segs = 80;
            const wallH = 4.3;

            for (let i = 0; i <= segs; i++) {
                const u = i / segs;
                const theta = -Math.PI * 0.25 + (Math.PI * 0.5) * u;
                const r = getWallRadiusAtAngle(theta);
                const wx = Math.sin(theta) * r;
                const wz = -Math.cos(theta) * r;

                positions.push(wx, 0, wz);
                uvs.push(u, 0);
                positions.push(wx, wallH, wz);
                uvs.push(u, 1);

                if (i < segs) {
                    const base = i * 2;
                    indices.push(base, base + 1, base + 2);
                    indices.push(base + 1, base + 3, base + 2);
                }
            }
            wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            wallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            wallGeo.setIndex(indices);
            wallGeo.computeVertexNormals();

            const wallMesh = new THREE.Mesh(
                wallGeo,
                new THREE.MeshLambertMaterial({ map: ivyTex, side: THREE.DoubleSide })
            );
            scene.add(wallMesh);

            // 2. Tiered Dark-Green Koshien Outfield & Alps Grandstands + Upper-Deck Billboards (`image_ac0d18.jpg`)
            const standGeo = new THREE.BufferGeometry();
            const sPos = [];
            const sIdx = [];
            const standSegs = 64;
            for (let i = 0; i <= standSegs; i++) {
                const u = i / standSegs;
                const theta = -Math.PI * 0.34 + (Math.PI * 0.68) * u;
                const rInner = getWallRadiusAtAngle(THREE.MathUtils.clamp(theta, -Math.PI * 0.25, Math.PI * 0.25)) + 1.5;
                const rOuter = rInner + 16.0;

                sPos.push(Math.sin(theta) * rInner, 3.8, -Math.cos(theta) * rInner);
                sPos.push(Math.sin(theta) * rOuter, 15.5, -Math.cos(theta) * rOuter);

                if (i < standSegs) {
                    const b = i * 2;
                    sIdx.push(b, b + 1, b + 2);
                    sIdx.push(b + 1, b + 3, b + 2);
                }
            }
            standGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
            standGeo.setIndex(sIdx);
            standGeo.computeVertexNormals();
            const grandstands = new THREE.Mesh(
                standGeo,
                new THREE.MeshLambertMaterial({ color: 0x132a22, side: THREE.DoubleSide })
            );
            scene.add(grandstands);

            // Upper-deck Sponsor Rim Band (`SUZUKI`, `ZETT`, `LAWSON`)
            const upperTex = createUpperDeckBillboardsTexture();
            const rimGeo = new THREE.BufferGeometry();
            const rPos = [];
            const rUvs = [];
            const rIdx = [];
            for (let i = 0; i <= standSegs; i++) {
                const u = i / standSegs;
                const theta = -Math.PI * 0.33 + (Math.PI * 0.66) * u;
                const r = getWallRadiusAtAngle(THREE.MathUtils.clamp(theta, -Math.PI * 0.25, Math.PI * 0.25)) + 17.2;
                rPos.push(Math.sin(theta) * r, 15.2, -Math.cos(theta) * r);
                rUvs.push(u, 0);
                rPos.push(Math.sin(theta) * r, 19.6, -Math.cos(theta) * r);
                rUvs.push(u, 1);

                if (i < standSegs) {
                    const b = i * 2;
                    rIdx.push(b, b + 1, b + 2);
                    rIdx.push(b + 1, b + 3, b + 2);
                }
            }
            rimGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPos, 3));
            rimGeo.setAttribute('uv', new THREE.Float32BufferAttribute(rUvs, 2));
            rimGeo.setIndex(rIdx);
            rimGeo.computeVertexNormals();
            const upperRim = new THREE.Mesh(
                rimGeo,
                new THREE.MeshBasicMaterial({ map: upperTex, side: THREE.DoubleSide })
            );
            scene.add(upperRim);

            // Tall Yellow Foul Poles in Left & Right Corners
            const poleMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            [-1, 1].forEach(dir => {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 21, 12), poleMat);
                pole.position.set(dir * 67.18, 10.5, -67.18);
                scene.add(pole);
            });

            // 3. Dead-Center Iconic Black-Green Koshien Scoreboard with Clock Tower (`image_ac0d18.jpg`)
            scoreboardCanvas = document.createElement('canvas');
            scoreboardCanvas.width = 640;
            scoreboardCanvas.height = 320;
            scoreboardCtx = scoreboardCanvas.getContext('2d');
            scoreboardTexture = new THREE.CanvasTexture(scoreboardCanvas);

            const sbGroup = new THREE.Group();
            sbGroup.position.set(0, 0, -123.5);

            // Main dark-green/black scoreboard housing
            const mainHousing = new THREE.Mesh(
                new THREE.BoxGeometry(34, 15.5, 3.0),
                new THREE.MeshLambertMaterial({ color: 0x0b1f18 })
            );
            mainHousing.position.y = 14.5;
            sbGroup.add(mainHousing);

            // Iconic central clock tower turret on top of the scoreboard
            const turret = new THREE.Mesh(
                new THREE.BoxGeometry(7.2, 4.5, 2.8),
                new THREE.MeshLambertMaterial({ color: 0x0b1f18 })
            );
            turret.position.y = 24.0;
            sbGroup.add(turret);

            const clockFace = new THREE.Mesh(
                new THREE.CircleGeometry(1.35, 24),
                new THREE.MeshBasicMaterial({ color: 0xf8fafc })
            );
            clockFace.position.set(0, 24.0, 1.45);
            sbGroup.add(clockFace);

            // Green LED Scoreboard Display
            const boardScreen = new THREE.Mesh(
                new THREE.PlaneGeometry(31.2, 13.4),
                new THREE.MeshBasicMaterial({ map: scoreboardTexture })
            );
            boardScreen.position.set(0, 14.5, 1.56);
            sbGroup.add(boardScreen);

            scene.add(sbGroup);
            update3DScoreboard();

            // 4. Twin Towering Lattice-Steel Floodlight Towers in Left-Center & Right-Center (`image_ac0d18.jpg`)
            [-1, 1].forEach(side => {
                const towerGroup = new THREE.Group();
                const tx = side * 44.0;
                const tz = -126.0;
                towerGroup.position.set(tx, 0, tz);
                towerGroup.rotation.y = -side * 0.28;

                // Steel support legs
                const steelMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6, roughness: 0.4 });
                [-1.4, 1.4].forEach(lx => {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.55, 39, 8), steelMat);
                    leg.position.set(lx, 19.5, 0);
                    towerGroup.add(leg);
                });

                // Cross-bracing struts
                for (let y = 10; y <= 34; y += 6) {
                    const brace = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.35, 0.4), steelMat);
                    brace.position.set(0, y, 0);
                    towerGroup.add(brace);
                }

                // Sponsor banner halfway up the tower (like Asahi / Suntory in `image_ac0d18.jpg`)
                const banner = new THREE.Mesh(
                    new THREE.BoxGeometry(4.6, 8.5, 0.6),
                    new THREE.MeshBasicMaterial({ color: side === -1 ? 0x1d4ed8 : 0xdc2626 })
                );
                banner.position.set(0, 26.5, 0.35);
                towerGroup.add(banner);

                // Large Rectangular Floodlight Bank at Top
                const bankFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(11.5, 6.2, 1.2),
                    new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.4 })
                );
                bankFrame.position.set(0, 39.5, 0);
                towerGroup.add(bankFrame);

                // Glowing floodlight bulbs grid
                const bulbMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
                for (let r = -2; r <= 2; r++) {
                    for (let c = -4; c <= 4; c++) {
                        const bulb = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.75), bulbMat);
                        bulb.position.set(c * 1.15, 39.5 + r * 1.05, 0.65);
                        towerGroup.add(bulb);
                    }
                }

                scene.add(towerGroup);
            });

            // 5. Animated Cheering Crowd in Grandstands
            for (let row = 0; row < 8; row++) {
                const rDist = 101 + row * 1.8;
                const yPos = 4.6 + row * 1.25;
                for (let deg = -54; deg <= 54; deg += 2.6) {
                    if (Math.abs(deg) < 11) continue; // Leave center batter's eye clear behind scoreboard
                    const rad = THREE.MathUtils.degToRad(deg);
                    crowdData.push({
                        x: Math.sin(rad) * rDist,
                        y: yPos,
                        z: -Math.cos(rad) * rDist,
                        angle: -rad,
                        section: deg >= 0 ? 'home' : 'away',
                        phase: deg * 0.15 + row * 0.35
                    });
                }
            }

            if (crowdData.length > 0) {
                crowdBodyInstanced = new THREE.InstancedMesh(
                    new THREE.CylinderGeometry(0.28, 0.32, 0.65, 8),
                    new THREE.MeshLambertMaterial({ color: 0xffffff }),
                    crowdData.length
                );
                crowdHeadInstanced = new THREE.InstancedMesh(
                    new THREE.SphereGeometry(0.24, 8, 8),
                    new THREE.MeshLambertMaterial({ color: 0xfdd5b1 }),
                    crowdData.length
                );
                crowdPropInstanced = new THREE.InstancedMesh(
                    new THREE.BoxGeometry(0.16, 0.40, 0.16),
                    new THREE.MeshBasicMaterial({ color: 0xffffff }),
                    crowdData.length
                );
                scene.add(crowdBodyInstanced, crowdHeadInstanced, crowdPropInstanced);
                updateSpectatorColors();
            }
        }

        function updateSpectatorColors() {
            if (!crowdBodyInstanced || !crowdPropInstanced) return;
            const cBody = new THREE.Color();
            const cProp = new THREE.Color();
            crowdData.forEach((s, i) => {
                if (s.section === 'home') {
                    cBody.set(i % 3 === 0 ? '#ffffff' : state.teamColor);
                    cProp.set(i % 2 === 0 ? '#facc15' : state.teamColor);
                } else {
                    cBody.set(i % 3 === 0 ? '#ffffff' : '#dc2626');
                    cProp.set(i % 2 === 0 ? '#ffffff' : '#dc2626');
                }
                crowdBodyInstanced.setColorAt(i, cBody);
                crowdPropInstanced.setColorAt(i, cProp);
            });
            if (crowdBodyInstanced.instanceColor) crowdBodyInstanced.instanceColor.needsUpdate = true;
            if (crowdPropInstanced.instanceColor) crowdPropInstanced.instanceColor.needsUpdate = true;
        }

        function update3DScoreboard() {
            if (!scoreboardCtx || !scoreboardTexture) return;
            const ctx = scoreboardCtx;
            ctx.fillStyle = '#041f17';
            ctx.fillRect(0, 0, 640, 320);

            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 6;
            ctx.strokeRect(10, 10, 620, 300);

            ctx.fillStyle = '#6ee7b7';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('HANSHIN KOSHIEN STADIUM', 320, 48);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(state.schoolName, 320, 106);

            ctx.fillStyle = '#fde047';
            ctx.font = '900 44px sans-serif';
            ctx.fillText(`BEST: ${state.bestDistance.toFixed(2)}m`, 320, 178);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText(`HR: ${state.homeRunCount}   |   HITS: ${state.hitCount}`, 320, 246);

            scoreboardTexture.needsUpdate = true;
        }

        /**
         * ============================================================================
         * 5. 2-HEAD SD POWERPRO PITCHER & BATTER 3D CHARACTERS
         * ============================================================================
         */
        function createPowerProHeadTexture(hairColor = '#2b1d14') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fdd5b1';
            ctx.fillRect(0, 0, 512, 256);

            ctx.fillStyle = 'rgba(244, 114, 128, 0.28)';
            ctx.beginPath();
            ctx.ellipse(212, 162, 16, 9, 0, 0, Math.PI * 2);
            ctx.ellipse(300, 162, 16, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = hairColor;
            ctx.fillRect(0, 48, 178, 155);
            ctx.fillRect(334, 48, 178, 155);

            ctx.beginPath();
            ctx.moveTo(195, 78);
            ctx.lineTo(222, 102);
            ctx.lineTo(240, 82);
            ctx.lineTo(258, 104);
            ctx.lineTo(276, 82);
            ctx.lineTo(295, 100);
            ctx.lineTo(316, 78);
            ctx.closePath();
            ctx.fill();

            [228, 284].forEach((ex, idx) => {
                const isLeft = idx === 0;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(ex, 136, 17, 19, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1e1b18';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.ellipse(ex + (isLeft ? 2 : -2), 137, 10.5, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex + (isLeft ? -2 : -5), 131, 4.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.ellipse(ex, 135, 18, 19, 0, Math.PI * 1.08, Math.PI * 1.92);
                ctx.stroke();

                ctx.strokeStyle = hairColor;
                ctx.lineWidth = 5.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                if (isLeft) {
                    ctx.moveTo(ex - 16, 108);
                    ctx.lineTo(ex + 14, 115);
                } else {
                    ctx.moveTo(ex - 14, 115);
                    ctx.lineTo(ex + 16, 108);
                }
                ctx.stroke();
            });

            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(244, 176);
            ctx.quadraticCurveTo(256, 172, 268, 176);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function createPinstripeUniformTexture(jerseyHex, numberStr = '4', emblem = 'S', isPinstripe = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = isPinstripe ? '#f8fafc' : jerseyHex;
            ctx.fillRect(0, 0, 512, 256);

            if (isPinstripe) {
                ctx.fillStyle = '#1e293b';
                for (let x = 6; x < 512; x += 18) {
                    ctx.fillRect(x, 0, 3, 256);
                }
            }

            ctx.fillStyle = jerseyHex;
            ctx.fillRect(0, 0, 512, 32);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 224, 512, 32);
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(244, 226, 24, 28);

            ctx.fillStyle = isPinstripe ? jerseyHex : '#ffffff';
            ctx.font = '900 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(emblem, 224, 116);

            [0, 512].forEach(bx => {
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = isPinstripe ? jerseyHex : '#0f172a';
                ctx.lineWidth = 8;
                ctx.font = '900 112px sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(String(numberStr), bx, 172);
                ctx.fillText(String(numberStr), bx, 172);
            });

            return new THREE.CanvasTexture(canvas);
        }

        function createCapEmblemTexture(letter = 'S', bgHex = '#2563eb') {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgHex;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 8;
            ctx.font = '900 84px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeText(letter, 64, 68);
            ctx.fillText(letter, 64, 68);
            return new THREE.CanvasTexture(canvas);
        }

        function createSDCharacter({ jerseyHex = '#2563eb', role = 'batter', numberStr = '4', emblem = 'S', isPinstripe = true }) {
            const root = new THREE.Group();
            const sleeveMat = new THREE.MeshLambertMaterial({ color: jerseyHex });
            const pantsMat = new THREE.MeshLambertMaterial({ color: '#f8fafc' });
            const skinMat = new THREE.MeshLambertMaterial({ color: '#fdd5b1' });
            const gloveMat = new THREE.MeshStandardMaterial({ color: '#92400e', roughness: 0.55 });
            const batMat = new THREE.MeshStandardMaterial({ color: '#e2e8f0', metalness: 0.78, roughness: 0.2 });

            const uniformTex = createPinstripeUniformTexture(jerseyHex, numberStr, emblem, isPinstripe);
            const torsoMat = new THREE.MeshLambertMaterial({ map: uniformTex });

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.44, 24), torsoMat);
            torso.position.set(0, 0.56, 0);
            torso.rotation.y = -Math.PI / 2;
            torso.castShadow = true;
            root.add(torso);

            const pelvis = new THREE.Mesh(
                new THREE.SphereGeometry(0.275, 20, 14, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.55),
                pantsMat
            );
            pelvis.position.set(0, 0.38, 0);
            pelvis.castShadow = true;
            root.add(pelvis);

            [-0.27, 0.27].forEach(sx => {
                const sleeve = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 12), sleeveMat);
                sleeve.scale.set(1.25, 0.95, 0.95);
                sleeve.position.set(sx, 0.68, 0);
                root.add(sleeve);
            });

            // 2-Head SD Spherical Head
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 1.10, 0);

            const headSphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.36, 28, 22),
                new THREE.MeshLambertMaterial({ map: createPowerProHeadTexture(role === 'pitcher' ? '#1e293b' : '#2b1d14') })
            );
            headSphere.rotation.y = -Math.PI / 2;
            headSphere.castShadow = true;
            headGroup.add(headSphere);

            const capGroup = new THREE.Group();
            const capMat = new THREE.MeshStandardMaterial({ color: jerseyHex, roughness: 0.25 });
            const capDome = new THREE.Mesh(
                new THREE.SphereGeometry(0.376, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.53),
                capMat
            );
            capDome.castShadow = true;
            capGroup.add(capDome);

            const brim = new THREE.Mesh(
                new THREE.CylinderGeometry(0.34, 0.37, 0.032, 24, 1, false, -Math.PI * 0.36, Math.PI * 0.72),
                capMat
            );
            brim.position.set(0, 0.03, 0.14);
            brim.rotation.x = 0.12;
            capGroup.add(brim);

            const emblemBadge = new THREE.Mesh(
                new THREE.PlaneGeometry(0.15, 0.15),
                new THREE.MeshBasicMaterial({ map: createCapEmblemTexture(emblem, jerseyHex), transparent: true })
            );
            emblemBadge.position.set(0, 0.16, 0.365);
            emblemBadge.rotation.x = -0.35;
            capGroup.add(emblemBadge);

            if (role === 'batter') {
                const earFlap = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.22), capMat);
                earFlap.position.set(-0.365, -0.06, 0.02);
                capGroup.add(earFlap);
            }

            headGroup.add(capGroup);
            root.add(headGroup);

            // Floating Hands + Bat (for batter) or Glove + Held Baseball (for pitcher)
            const leftHandPivot = new THREE.Group();
            leftHandPivot.position.set(-0.34, 0.58, 0.14);

            const rightHandPivot = new THREE.Group();
            rightHandPivot.position.set(0.34, 0.58, 0.14);

            let batMesh = null;
            let heldBall = null;

            if (role === 'batter') {
                const lHand = new THREE.Mesh(new THREE.SphereGeometry(0.095, 16, 14), skinMat);
                leftHandPivot.add(lHand);

                const rHand = new THREE.Mesh(new THREE.SphereGeometry(0.095, 16, 14), skinMat);
                rHand.position.set(-0.18, 0.09, 0.06);
                rightHandPivot.add(rHand);

                batMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.021, 0.96, 14), batMat);
                batMesh.position.set(-0.08, 0.45, 0.04);
                batMesh.rotation.set(-0.28, 0, -0.38);
                batMesh.castShadow = true;
                rightHandPivot.add(batMesh);
            } else {
                // Pitcher: Right-handed pitcher -> Glove on LEFT hand (+X when facing +Z), Ball in RIGHT hand (-X when facing +Z)
                leftHandPivot.position.set(0.34, 0.58, 0.16);
                rightHandPivot.position.set(-0.34, 0.58, 0.16);

                const glove = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 14), gloveMat);
                glove.scale.set(1.05, 1.15, 0.65);
                leftHandPivot.add(glove);

                const rHand = new THREE.Mesh(new THREE.SphereGeometry(0.095, 16, 14), skinMat);
                rightHandPivot.add(rHand);

                heldBall = new THREE.Mesh(
                    new THREE.SphereGeometry(0.06, 12, 12),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
                );
                heldBall.position.set(0, 0.04, 0.07);
                rightHandPivot.add(heldBall);
            }
            root.add(leftHandPivot, rightHandPivot);

            // Cleated Baseball Shoes
            function makeFoot() {
                const fg = new THREE.Group();
                const shoeMat = new THREE.MeshStandardMaterial({ color: jerseyHex, roughness: 0.35 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.13, 0.32), shoeMat);
                body.position.set(0, 0.08, 0.04);
                body.castShadow = true;
                fg.add(body);
                const toe = new THREE.Mesh(new THREE.SphereGeometry(0.096, 14, 12), shoeMat);
                toe.scale.set(1.0, 0.72, 1.1);
                toe.position.set(0, 0.075, 0.18);
                fg.add(toe);
                return fg;
            }
            const leftFoot = makeFoot();
            leftFoot.position.set(-0.15, 0, 0);
            const rightFoot = makeFoot();
            rightFoot.position.set(0.15, 0, 0);
            root.add(leftFoot, rightFoot);

            return {
                root,
                torso,
                headGroup,
                leftHandPivot,
                rightHandPivot,
                leftFoot,
                rightFoot,
                batMesh,
                heldBall,
                updateAppearance(newHex, newEmblem, isWoodBat = false) {
                    torsoMat.map = createPinstripeUniformTexture(newHex, numberStr, newEmblem, isPinstripe);
                    torsoMat.needsUpdate = true;
                    sleeveMat.color.set(newHex);
                    capGroup.children.forEach(c => {
                        if (c.material && c.material.color && c !== emblemBadge) c.material.color.set(newHex);
                    });
                    emblemBadge.material.map = createCapEmblemTexture(newEmblem, newHex);
                    emblemBadge.material.needsUpdate = true;
                    if (batMesh) {
                        if (isWoodBat) {
                            batMesh.material.color.set('#b45309');
                            batMesh.material.metalness = 0.08;
                            batMesh.material.roughness = 0.55;
                        } else {
                            batMesh.material.color.set('#e2e8f0');
                            batMesh.material.metalness = 0.78;
                            batMesh.material.roughness = 0.2;
                        }
                    }
                }
            };
        }

        function buildPitcherAndBatter() {
            // 1. SD High-School Batter in Right-Handed Batter's Box (-0.78, 0.015, 0.08) facing the plate (+X)
            batter3D = createSDCharacter({
                jerseyHex: state.teamColor,
                role: 'batter',
                numberStr: '4',
                emblem: state.capEmblem,
                isPinstripe: true
            });
            batter3D.root.position.set(-0.78, 0.015, 0.08);
            batter3D.root.rotation.y = Math.PI * 0.48;
            scene.add(batter3D.root);

            // 2. Opposing SD Pitcher on Mound (0, 0.26, -18.44) facing Home Plate (+Z)
            pitcher3D = createSDCharacter({
                jerseyHex: '#b91c1c',
                role: 'pitcher',
                numberStr: '1',
                emblem: '龍',
                isPinstripe: false
            });
            pitcher3D.root.position.set(0, 0.26, -18.44);
            pitcher3D.root.rotation.y = 0; // Facing +Z toward home plate
            scene.add(pitcher3D.root);
        }

        /**
         * ============================================================================
         * 6. STRIKE ZONE FRAME, SHRINKING TIMING RING, BALL & TAPERED RIBBON TRAIL
         * ============================================================================
         */
        function buildStrikeZoneAndBallEffects() {
            // 1. Translucent Strike Zone Frame over Home Plate (z = 0.0, y = 0.60 to 1.16)

        function updateRibbonGeometry() {
            const pts = state.flight.trailPoints;
            if (!ribbonMesh || pts.length < 2) {
                if (ribbonMesh) ribbonMesh.visible = false;
                return;
            }
            ribbonMesh.visible = true;
            const posAttr = ribbonMesh.geometry.attributes.position;
            const alphaAttr = ribbonMesh.geometry.attributes.alpha;
            const maxPts = 54;

            for (let i = 0; i < maxPts; i++) {
                const idx = Math.min(i, pts.length - 1);
                const p = pts[idx];
                const t = i / Math.max(1, pts.length - 1); // 0 at ball head, 1 at tapered tail
                const halfWidth = (1 - t) * 0.14;
                const alpha = Math.pow(1 - t, 1.35);

                const toCam = new THREE.Vector3().subVectors(camera.position, p).normalize();
                const tangent = idx < pts.length - 1
                    ? new THREE.Vector3().subVectors(p, pts[idx + 1]).normalize()
                    : new THREE.Vector3(0, 0, -1);
                const side = new THREE.Vector3().crossVectors(toCam, tangent).normalize();
                if (side.lengthSq() < 0.001) side.set(1, 0, 0);

                posAttr.setXYZ(i * 2, p.x - side.x * halfWidth, p.y - side.y * halfWidth, p.z - side.z * halfWidth);
                posAttr.setXYZ(i * 2 + 1, p.x + side.x * halfWidth, p.y + side.y * halfWidth, p.z + side.z * halfWidth);
                alphaAttr.setX(i * 2, alpha);
                alphaAttr.setX(i * 2 + 1, alpha);
            }
            posAttr.needsUpdate = true;
            alphaAttr.needsUpdate = true;
        }

        function showJudgment(title, sub, colorClass = 'text-amber-300') {
            const pop = document.getElementById('judgment-popup');
            const tEl = document.getElementById('judgment-title');
            const sEl = document.getElementById('judgment-sub');
            tEl.textContent = title;
            tEl.className = `font-display text-4xl sm:text-6xl drop-shadow-[0_4px_14px_rgba(0,0,0,0.95)] whitespace-nowrap ${colorClass}`;
            sEl.textContent = sub;

            pop.classList.remove('hidden');
            pop.classList.remove('animate-judge');

            pop._timer = setTimeout(() => pop.classList.add('hidden'), 1180);

            pitcher3D.root.position.set(0, 0.26, -18.44);
            pitcher3D.torso.rotation.set(0, -Math.PI / 2, 0);
            pitcher3D.leftFoot.position.set(-0.15, 0, 0);
            pitcher3D.rightFoot.position.set(0.15, 0, 0);
