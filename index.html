        function startPitchWindup() {
            state.phase = 'pitch_windup';
            state.pitch.timer = 0;
            state.pitch.windupDuration = 0.94;
            state.pitch.passedPlate = false;
            state.pitch.postPlateTimer = 0;

            // Choose Pitch Spec (Random realistic mix or user-selected pitch pill)
            const chosenKey = state.selectedPitchFilter === 'random'
                ? PITCH_KEYS[Math.floor(Math.random() * PITCH_KEYS.length)]
                : state.selectedPitchFilter;
            const spec = PITCH_TYPES[chosenKey] || PITCH_TYPES.four_seam;
            state.pitch.spec = spec;
            state.pitch.speedKmh = Math.round(spec.minKmh + Math.random() * (spec.maxKmh - spec.minKmh));

            // Target plate crossing point inside or right on the edge of the strike zone
            const targetX = (Math.random() - 0.5) * 0.34;
            const targetY = 0.68 + Math.random() * 0.38;
            state.pitch.targetPos.set(targetX, targetY, 0.0);

            document.getElementById('hud-callout-text').textContent = `투수 와인드업... (${spec.name} 예고)`;
            setPrompt(true, 'Tap to Swing!', '링이 줄어들 때 타이밍 스윙!');
        }

        function releasePitchFromMound() {
            state.phase = 'pitch_flight';
            state.pitch.flightTimer = 0;

            const spec = state.pitch.spec;
            const speedMs = state.pitch.speedKmh / 3.6;
            const start = new THREE.Vector3(-0.22, 1.48, -17.05);
            const target = state.pitch.targetPos;
            const distZ = Math.abs(target.z - start.z); // 17.05m
            const T = distZ / speedMs;

            state.pitch.startPos.copy(start);
            state.pitch.flightDuration = T;
            state.pitch.prevPos.copy(start);

            // Solve exact initial velocity v0 so P(T) = P0 + v0*T + 0.5*g*T^2 + breakVec = target
            const g = 9.81;
            const vx = (target.x - start.x - spec.breakVec.x) / T;
            const vy = (target.y - start.y + 0.5 * g * T * T - spec.breakVec.y) / T;
            const vz = (target.z - start.z) / T;
            state.pitch.vel0.set(vx, vy, vz);

            // Hide ball in pitcher's hand, activate live 3D pitched ball + aura + target & shrinking rings
            if (pitcher3D.heldBall) pitcher3D.heldBall.visible = false;
            ballMesh.position.copy(start);
            ballMesh.visible = true;
            ballAuraMesh.material.color.setHex(spec.auraColor);

            ballShadowMesh.position.set(start.x, 0.03, start.z);
            ballShadowMesh.visible = true;

            targetRingMesh.position.set(target.x, target.y, 0.0);
            targetRingMesh.material.color.setHex(spec.auraColor);
            targetRingMesh.visible = true;

            shrinkingRingMesh.position.set(target.x, target.y, 0.0);
            shrinkingRingMesh.scale.setScalar(0.62);
            shrinkingRingMesh.material.color.setHex(0xfacc15);
            shrinkingRingMesh.visible = true;

            document.getElementById('hud-callout-text').textContent = `${spec.name} · ${state.pitch.speedKmh} km/h`;
            audio.playPitchRelease();
            spawnMoundDust(new THREE.Vector3(0, 0.28, -17.6));
        }

        function evaluatePitchPositionAtTime(t) {
            const p = state.pitch;
            const u = Math.max(0, t / p.flightDuration);
            const breakFactor = Math.pow(u, p.spec.breakPower);
            return new THREE.Vector3(
                p.startPos.x + p.vel0.x * t + p.spec.breakVec.x * breakFactor,
                p.startPos.y + p.vel0.y * t - 0.5 * 9.81 * t * t + p.spec.breakVec.y * breakFactor,
                p.startPos.z + p.vel0.z * t
            );
        }

        function triggerOneTapSwing() {
            if (state.swing.active) return;
            state.swing.active = true;
            state.swing.timer = 0;
            state.swing.contactChecked = false;
            audio.playSwingWhoosh();
        }

        function evaluatePitchSwingContact() {
            if (state.phase !== 'pitch_flight') return false;

            // Timing delta relative to exact plate crossing time `flightDuration`
            // deltaT < 0 means EARLY swing (ball hasn't reached plate yet)
            // deltaT > 0 means LATE swing (ball already passed plate)
            const deltaT = state.pitch.flightTimer - state.pitch.flightDuration;
            const absDelta = Math.abs(deltaT);

            // Max contact window: [-0.145s, +0.135s]
            if (deltaT < -0.145) {
                showJudgment('SWING & MISS!', '너무 빠른 스윙이었습니다!', 'text-slate-200');
                return false;
            }
            if (deltaT > 0.135) {
                showJudgment('SWING & MISS!', '스윙 타이밍이 늦었습니다!', 'text-slate-200');
                return false;
            }

            // Valid Bat-Ball Contact!
            const sweetness = Math.max(0, 1 - absDelta / 0.14);
            const isSweetSpot = absDelta <= 0.032;
            const isGreat = absDelta <= 0.072;

            // Wood bat rewards sweet spot even more
            const batBonus = state.batType === 'wood' ? (isSweetSpot ? 1.05 : 0.96) : 1.0;

            // Exit velocity (118 km/h to 184 km/h)
            const exitVelKmh = (120 + sweetness * 64) * batBonus;
            const exitSpeedMs = exitVelKmh / 3.6;

            let launchAngleDeg;
            let sprayAngleDeg;
            let spinRate;
            let isFoul = false;

            if (isSweetSpot) {
                // Dead-center / power-alley high backspin drive (115m - 165m+!)
                launchAngleDeg = 29.5 + (Math.random() - 0.5) * 4.5;
                sprayAngleDeg = (Math.random() - 0.5) * 14;
                spinRate = 2500;
                showJudgment('PERFECT!!', '완벽한 스윗스팟! 초대형 타구!', 'text-amber-300');
            } else if (deltaT < 0) {
                // EARLY SWING -> Pulled to Left Field (-sprayAngle)
                const earlyRatio = Math.min(1, Math.abs(deltaT) / 0.145);
                sprayAngleDeg = -12 - earlyRatio * 44; // up to -56 deg (foul past -45 deg)
                launchAngleDeg = 24 + earlyRatio * 24;
                spinRate = 2150;
                isFoul = Math.abs(sprayAngleDeg) > 45.0;
                if (isFoul) {
                    showJudgment('FOUL BALL!', '좌측 파울 라인을 벗어났습니다', 'text-rose-300');
                } else {
                    showJudgment(isGreat ? 'GREAT PULL!' : 'PULL HIT', '좌중간으로 강하게 당겨친 타구!', isGreat ? 'text-cyan-300' : 'text-sky-200');
                }
            } else {
                // LATE SWING -> Pushed to Right Field (+sprayAngle)
                const lateRatio = Math.min(1, deltaT / 0.135);
                sprayAngleDeg = 12 + lateRatio * 44; // up to +56 deg (foul past +45 deg)
                launchAngleDeg = 26 - lateRatio * 24;
                spinRate = 1900;
                isFoul = Math.abs(sprayAngleDeg) > 45.0;
                if (isFoul) {
                    showJudgment('FOUL BALL!', '우측 파울 라인을 벗어났습니다', 'text-rose-300');
                } else {
                    showJudgment(isGreat ? 'LINE DRIVE!' : 'OPPO HIT', '우중간으로 밀어친 날카로운 타구!', isGreat ? 'text-emerald-300' : 'text-amber-200');
                }
            }

            const elevRad = THREE.MathUtils.degToRad(launchAngleDeg);
            const sprayRad = THREE.MathUtils.degToRad(sprayAngleDeg);
            const horizSpeed = exitSpeedMs * Math.cos(elevRad);

            const contactPos = new THREE.Vector3(
                THREE.MathUtils.clamp(ballMesh.position.x, -0.25, 0.25),
                THREE.MathUtils.clamp(ballMesh.position.y, 0.62, 1.15),
                0.0
            );

            state.flight.timer = 0;
            state.flight.pos.copy(contactPos);
            state.flight.vel.set(
                horizSpeed * Math.sin(sprayRad),
                exitSpeedMs * Math.sin(elevRad),
                -horizSpeed * Math.cos(sprayRad)
            );
            state.flight.spinRate = spinRate;
            state.flight.bounces = 0;
            state.flight.landed = false;
            state.flight.isHomeRun = false;
            state.flight.hrCelebrated = false;
            state.flight.isFoul = isFoul;
            state.flight.exitVelKmh = Math.round(exitVelKmh);
            state.flight.launchAngleDeg = Math.round(launchAngleDeg);
            state.flight.trailPoints = [contactPos.clone()];

            if (!isFoul && exitVelKmh >= 134) {
                state.hitCount++;
                document.getElementById('hud-hit-count').textContent = state.hitCount;
                update3DScoreboard();
            }

            // Hitstop micro-freeze + Impact Shockwave + Sparks + Metallic "KANG!"
            state.hitstopTimer = isSweetSpot ? 0.045 : 0.022;
            impactRingMesh.position.copy(contactPos);
            impactRingMesh.scale.setScalar(0.5);
            impactRingMesh.material.opacity = 0.95;
            spawnContactSparks(contactPos);

            audio.playBatHit(sweetness, state.batType === 'wood');
            if (launchAngleDeg > 16) audio.playSkyWind(1.2);

            // Hide strike zone indicators & prompt during ball flight
            targetRingMesh.visible = false;
            shrinkingRingMesh.visible = false;
            strikeZoneGroup.visible = false;
            ballAuraMesh.material.opacity = 0.0;
            setPrompt(false);

            document.getElementById('hud-callout-text').textContent =
                `타구속도 ${state.flight.exitVelKmh}km/h · 발사각 ${state.flight.launchAngleDeg}°`;

            state.phase = 'ball_flight';
            return true;
        }

        function handlePrimaryAction() {
            audio.ensureCtx();
            if (!document.getElementById('customize-modal').classList.contains('hidden')) return;

            if (state.phase === 'ready_start') {
                startPitchWindup();
            } else if (state.phase === 'pitch_windup' || state.phase === 'pitch_flight') {
                triggerOneTapSwing();
            } else if (state.phase === 'result_ready') {
                resetToReadyState(true);
            }
        }

        /**
         * ============================================================================
         * 8. MAIN SIMULATION STEP: PITCHER WINDUP, PITCH FLIGHT, AERODYNAMICS & BALL-CHASE CAM
         * ============================================================================
         */
        function stepSimulation(dt, elapsed) {
            // 1. Batter Swing Animation & Contact Evaluation
            if (state.swing.active) {
                state.swing.timer += dt;
                const p = Math.min(1, state.swing.timer / state.swing.duration);
                const swingCurve = p < 0.45 ? Math.sin((p / 0.45) * (Math.PI / 2)) : 1.0 - (p - 0.45) * 0.25;
                batter3D.torso.rotation.y = -Math.PI / 2 + swingCurve * 1.48;
                batter3D.rightHandPivot.rotation.y = swingCurve * 2.08;
                batter3D.leftHandPivot.rotation.y = swingCurve * 1.78;

                // Check bat-ball contact as bat barrel crosses the plate
                if (!state.swing.contactChecked && p >= 0.12 && p <= 0.42 && state.phase === 'pitch_flight') {
                    state.swing.contactChecked = true;
                    evaluatePitchSwingContact();
                }

                if (p >= 1.0) {
                    state.swing.active = false;
                }
            } else if (state.phase === 'ready_start' || state.phase === 'pitch_windup' || state.phase === 'pitch_flight') {
                batter3D.torso.rotation.y = THREE.MathUtils.lerp(batter3D.torso.rotation.y, -Math.PI / 2, dt * 10);
                batter3D.rightHandPivot.rotation.y = THREE.MathUtils.lerp(batter3D.rightHandPivot.rotation.y, 0, dt * 10);
                batter3D.leftHandPivot.rotation.y = THREE.MathUtils.lerp(batter3D.leftHandPivot.rotation.y, 0, dt * 10);
            }

            // 2. Opposing SD Pitcher Windup, Leg-Kick & Release Animation
            if (state.phase === 'pitch_windup') {
                state.pitch.timer += dt;
                const u = Math.min(1, state.pitch.timer / state.pitch.windupDuration);

                if (u < 0.45) {
                    // Hands raise overhead
                    const k = u / 0.45;
                    pitcher3D.rightHandPivot.position.y = 0.58 + k * 0.65;
                    pitcher3D.leftHandPivot.position.y = 0.58 + k * 0.65;
                    pitcher3D.torso.rotation.y = -Math.PI / 2 - k * 0.45;
                } else if (u < 0.80) {
                    // High PowerPro Leg-Kick + Coiled Torso
                    const k = (u - 0.45) / 0.35;
                    const lift = Math.sin(k * Math.PI * 0.5);
                    pitcher3D.rightFoot.position.set(0.18, lift * 0.46, -0.10);
                    pitcher3D.torso.rotation.y = -Math.PI / 2 - 0.45 - lift * 0.35;
                    pitcher3D.rightHandPivot.position.set(-0.42, 1.15 - lift * 0.25, -0.18);
                } else {
                    // Explosive Forward Stride & Whip Release
                    const k = (u - 0.80) / 0.20;
                    pitcher3D.root.position.z = -18.44 + k * 0.85;
                    pitcher3D.rightFoot.position.set(0.16, (1 - k) * 0.46, k * 0.45);
                    pitcher3D.leftFoot.position.set(-0.16, k * 0.28, -k * 0.35);
                    pitcher3D.torso.rotation.y = -Math.PI / 2 - 0.80 + k * 1.45;
                    pitcher3D.rightHandPivot.position.set(-0.22, 1.25 - k * 0.35, 0.35 + k * 0.35);
                }

                if (u >= 1.0) {
                    releasePitchFromMound();
                }
            }

            // 3. Pitched Ball 3D Flight & Shrinking Timing Ring over Home Plate
            if (state.phase === 'pitch_flight') {
                state.pitch.flightTimer += dt;
                const pos = evaluatePitchPositionAtTime(state.pitch.flightTimer);
                ballMesh.position.copy(pos);

                // Spin visualization according to pitch type
                ballMesh.rotateOnAxis(state.pitch.spec.spinAxis, state.pitch.spec.spinRate * dt);
                ballAuraMesh.material.opacity = 0.28 + Math.sin(elapsed * 24) * 0.08;
                ballShadowMesh.position.set(pos.x, 0.03, pos.z);

                // Update Shrinking Timing Ring around Target Ring in Strike Zone (`z = 0.0`)
                const prog = state.pitch.flightTimer / state.pitch.flightDuration;
                if (prog <= 1.15) {
                    const ringScale = Math.max(0.06, (1.0 - prog) * 0.65 + 0.075);
                    shrinkingRingMesh.scale.setScalar(ringScale);
                    // Turns bright emerald/gold inside the sweet spot window (`prog` in [0.92, 1.07])
                    if (prog >= 0.91 && prog <= 1.08) {
                        shrinkingRingMesh.material.color.setHex(0x34d399);
                    } else {
                        shrinkingRingMesh.material.color.setHex(0xfacc15);
                    }
                }

                // Pitcher follow-through settle
                pitcher3D.torso.rotation.y = THREE.MathUtils.lerp(pitcher3D.torso.rotation.y, -Math.PI / 2 + 0.45, dt * 8);

                // Check if ball passed home plate without being hit
                if (!state.pitch.passedPlate && pos.z >= 0.15) {
                    state.pitch.passedPlate = true;
                    targetRingMesh.visible = false;
                    shrinkingRingMesh.visible = false;
                    audio.playCatcherMittPop();

                    if (!state.swing.contactChecked) {
                        showJudgment('STRIKE! (지나감)', `${state.pitch.spec.name} ${state.pitch.speedKmh}km/h`, 'text-sky-300');
                    }
                }

                if (state.pitch.passedPlate) {
                    state.pitch.postPlateTimer += dt;
                    if (state.pitch.postPlateTimer >= 0.36) {
                        ballMesh.visible = false;
                        ballShadowMesh.visible = false;
                        state.phase = 'ready_start';
                        setPrompt(true, 'Tap to Swing!', '다음 투구 준비 완료 · 클릭 / SPACE');
                    }
                }
            }

            // 4. Struck Ball Aerodynamic Flight (Quadratic Drag + Backspin Magnus Lift + Turf Bounce/Roll)
            if (state.phase === 'ball_flight') {
                const fl = state.flight;
                fl.timer += dt;

                if (!fl.landed) {
                    const subSteps = 4;
                    const subDt = dt / subSteps;
                    const dragCoeff = 0.0052;
                    const magnusCoeff = 0.0000185;

                    for (let s = 0; s < subSteps; s++) {
                        const speed = fl.vel.length();
                        if (speed > 0.01) {
                            const dragMag = dragCoeff * speed * speed;
                            const axDrag = -(fl.vel.x / speed) * dragMag;
                            const ayDrag = -(fl.vel.y / speed) * dragMag;
                            const azDrag = -(fl.vel.z / speed) * dragMag;

                            // Backspin Magnus lift
                            const horizSpd = Math.hypot(fl.vel.x, fl.vel.z);
                            const liftMag = magnusCoeff * fl.spinRate * horizSpd;

                            fl.vel.x += axDrag * subDt;
                            fl.vel.y += (ayDrag + liftMag - 9.81) * subDt;
                            fl.vel.z += azDrag * subDt;
                        }

                        fl.pos.addScaledVector(fl.vel, subDt);

                        // Ground Collision & Koshien Kurotsuchi Dirt / Outfield Grass Bounce & Roll
                        if (fl.pos.y <= 0.07 && fl.vel.y < 0) {
                            fl.pos.y = 0.07;
                            if (fl.bounces === 0 && !fl.isHomeRun) {
                                spawnTurfDust(fl.pos);
                            }
                            fl.bounces++;
                            const isInDirt = Math.hypot(fl.pos.x, fl.pos.z + 19.2) < 35.5;
                            const restitution = isInDirt ? 0.45 : 0.36;
                            const bounceDrag = isInDirt ? 0.81 : 0.72;

                            if (Math.abs(fl.vel.y) > 1.1) {
                                fl.vel.y = -fl.vel.y * restitution;
                            } else {
                                fl.vel.y = 0;
                            }
                            fl.vel.x *= bounceDrag;
                            fl.vel.z *= bounceDrag;
                        }

                        // Rolling deceleration
                        if (fl.pos.y <= 0.08 && Math.abs(fl.vel.y) < 0.2) {
                            const rollDecel = 5.2 * subDt;
                            const hSpd = Math.hypot(fl.vel.x, fl.vel.z);
                            if (hSpd > rollDecel) {
                                const scale = (hSpd - rollDecel) / hSpd;
                                fl.vel.x *= scale;
                                fl.vel.z *= scale;
                            } else {
                                fl.vel.x = 0;
                                fl.vel.z = 0;
                            }
                        }
                    }

                    ballMesh.position.copy(fl.pos);
                    ballMesh.rotation.x -= dt * 36;
                    ballShadowMesh.position.set(fl.pos.x, 0.032, fl.pos.z);

                    fl.trailPoints.unshift(fl.pos.clone());
                    if (fl.trailPoints.length > 54) fl.trailPoints.pop();
                    updateRibbonGeometry();

                    // Live Distance Counter Update (`0.00m` -> `158.42m`)
                    const distM = Math.hypot(fl.pos.x, fl.pos.z);
                    state.currentDistance = distM;
                    document.getElementById('hud-live-distance').textContent = `${distM.toFixed(2)}m`;
                    if (!fl.isFoul && distM > state.bestDistance) {
                        saveBestDistance(distM);
                    }

                    // Check Koshien Ivy Fence Home Run Clearance (95m corners -> 118m center)
                    const sprayTheta = Math.atan2(fl.pos.x, -fl.pos.z);
                    const isFairAngle = Math.abs(sprayTheta) <= Math.PI * 0.252;
                    const fenceDist = getWallRadiusAtAngle(THREE.MathUtils.clamp(sprayTheta, -Math.PI * 0.25, Math.PI * 0.25));

                    if (!fl.isFoul && !fl.hrCelebrated && isFairAngle && distM >= fenceDist && fl.pos.y >= 3.2) {
                        fl.isHomeRun = true;
                        fl.hrCelebrated = true;
                        state.homeRunCount++;
                        document.getElementById('hud-hr-count').textContent = state.homeRunCount;
                        state.crowdWaveTimer = 2.5;
                        audio.playHomeRunCelebration();
                        spawnHomeRunFireworks();
                        update3DScoreboard();
                        showJudgment('HOME RUN!!', '고시엔 담장을 넘어가는 초대형 아치!', 'text-amber-300');
                    }

                    // Check if ball has come to rest
                    if (fl.pos.y <= 0.085 && fl.vel.length() < 0.25 && fl.timer > 0.45) {
                        fl.landed = true;
                        update3DScoreboard();
                        state.phase = 'result_ready';
                        const nextBtn = document.getElementById('next-btn');
                        nextBtn.classList.remove('hidden');
                        nextBtn.classList.add('animate-next-btn');
                    }
                }
            }

            // 5. Camera Controller: Holds 0.25s on Batter Follow-Through, then Smoothly Tracks Behind Ball!
            let desiredPos = HOME_CAM_POS;
            let desiredLook = HOME_CAM_LOOK;

            if (state.phase === 'ball_flight' || state.phase === 'result_ready') {
                if (state.flight.timer >= 0.25) {
                    const bPos = state.flight.pos;
                    const hVel = new THREE.Vector3(state.flight.vel.x, 0, state.flight.vel.z);
                    const flightDir = hVel.lengthSq() > 0.05
                        ? hVel.normalize()
                        : new THREE.Vector3(bPos.x, 0, bPos.z).normalize();
                    if (flightDir.lengthSq() < 0.01) flightDir.set(0, 0, -1);

                    // High Behind-the-Ball Chase Camera looking down over the field & distance arcs
                    desiredPos = new THREE.Vector3(
                        bPos.x - flightDir.x * 5.8,
                        Math.max(2.2, bPos.y + 2.8),
                        bPos.z - flightDir.z * 5.8
                    );
                    desiredLook = new THREE.Vector3(
                        bPos.x + flightDir.x * 14.0,
                        Math.max(0.2, bPos.y - 3.5),
                        bPos.z + flightDir.z * 14.0
                    );
                }
            }

            const lerpFactor = (state.phase === 'ready_start' || state.phase === 'pitch_windup' || state.phase === 'pitch_flight')
                ? Math.min(1, dt * 9.0)
                : Math.min(1, dt * 6.0);
            camCurrentPos.lerp(desiredPos, lerpFactor);
            camCurrentLook.lerp(desiredLook, lerpFactor);
            camera.position.copy(camCurrentPos);
            camera.lookAt(camCurrentLook);

            // 6. Impact Ring, Particles, Clouds & Cheering Grandstand Spectators
            if (impactRingMesh && impactRingMesh.material.opacity > 0) {
                impactRingMesh.scale.addScalar(dt * 15);
                impactRingMesh.material.opacity = Math.max(0, impactRingMesh.material.opacity - dt * 2.8);
            }

            [moundDustParticles, turfDustParticles, sparkParticles].forEach(sys => {
                if (sys && sys.life > 0) {
                    sys.life -= dt;
                    sys.points.material.opacity = Math.max(0, sys.life * 1.4);
                    const attr = sys.points.geometry.attributes.position;
                    for (let i = 0; i < attr.count; i++) {
                        sys.vels[i].y -= 6.5 * dt;
                        attr.setXYZ(
                            i,
                            attr.getX(i) + sys.vels[i].x * dt,
                            Math.max(0.03, attr.getY(i) + sys.vels[i].y * dt),
                            attr.getZ(i) + sys.vels[i].z * dt
                        );
                    }
                    attr.needsUpdate = true;
                }
            });

            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                const fw = fireworkParticles[i];
                fw.life -= dt;
                fw.points.material.opacity = Math.max(0, fw.life / 1.65);
                const attr = fw.points.geometry.attributes.position;
                for (let j = 0; j < attr.count; j++) {
                    fw.vels[j].y -= 4.2 * dt;
                    attr.setXYZ(
                        j,
                        attr.getX(j) + fw.vels[j].x * dt,
                        attr.getY(j) + fw.vels[j].y * dt,
                        attr.getZ(j) + fw.vels[j].z * dt
                    );
                }
                attr.needsUpdate = true;
                if (fw.life <= 0) {
                    scene.remove(fw.points);
                    fireworkParticles.splice(i, 1);
                }
            }

            if (cloudsGroup) {
                cloudsGroup.children.forEach((c, idx) => {
                    c.position.x += dt * (0.55 + (idx % 3) * 0.2);
                    if (c.position.x > 175) c.position.x = -175;
                });
            }

            if (state.crowdWaveTimer > 0) state.crowdWaveTimer -= dt;
            if (crowdBodyInstanced && crowdHeadInstanced && crowdPropInstanced && crowdData.length > 0) {
                const dummy = new THREE.Object3D();
                const isWave = state.crowdWaveTimer > 0;
                for (let i = 0; i < crowdData.length; i++) {
                    const s = crowdData[i];
                    const bounce = isWave
                        ? Math.max(0, Math.sin(s.x * 0.22 - elapsed * 9.5)) * 0.5
                        : Math.abs(Math.sin(elapsed * 4.6 + s.phase)) * 0.14;

                    dummy.position.set(s.x, s.y + bounce, s.z);
                    dummy.rotation.set(0, s.angle, 0);
                    dummy.updateMatrix();
                    crowdBodyInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.position.set(s.x, s.y + 0.50 + bounce, s.z);
                    dummy.updateMatrix();
                    crowdHeadInstanced.setMatrixAt(i, dummy.matrix);

                    const pump = Math.sin(elapsed * 7.8 + s.phase) * 0.15;
                    dummy.position.set(s.x + 0.18, s.y + 0.54 + bounce + pump, s.z);
                    dummy.rotation.set(0, s.angle, pump * 2.0);
                    dummy.updateMatrix();
                    crowdPropInstanced.setMatrixAt(i, dummy.matrix);
                }
                crowdBodyInstanced.instanceMatrix.needsUpdate = true;
                crowdHeadInstanced.instanceMatrix.needsUpdate = true;
                crowdPropInstanced.instanceMatrix.needsUpdate = true;
            }
        }

        /**
         * ============================================================================
         * 9. INPUT LISTENERS, PITCH SELECTOR PILLS, RESIZE & MAIN LOOP
         * ============================================================================
         */
        function bindEvents() {
            const wrapper = document.getElementById('canvas-wrapper');

            wrapper.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button')) return;
                handlePrimaryAction();
            });

            document.getElementById('next-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                audio.ensureCtx();
                resetToReadyState(true);
            });

            // Top-Right Pitch Selector Pills
            document.querySelectorAll('.pitch-pill').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audio.ensureCtx();
                    const pitchId = btn.dataset.pitch;
                    state.selectedPitchFilter = pitchId;

                    document.querySelectorAll('.pitch-pill').forEach(p => {
                        p.className = 'pitch-pill px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-800 text-white font-bold text-[11px] sm:text-xs shadow-md border border-white/25 transition cursor-pointer';
                    });
                    btn.className = 'pitch-pill px-2.5 py-1 rounded-full bg-amber-400 text-slate-950 font-black text-[11px] sm:text-xs shadow-md border border-white/70 transition cursor-pointer';

                    const label = pitchId === 'random' ? '랜덤 실전 배합' : PITCH_TYPES[pitchId].name;
                    document.getElementById('hud-callout-text').textContent = `다음 구종 설정: ${label}`;

                    if (state.phase === 'ready_start' || state.phase === 'result_ready') {
                        resetToReadyState(true);
                    }
                });
            });

            document.getElementById('mute-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const muted = audio.toggleMute();
                document.getElementById('mute-icon').textContent = muted ? '🔇' : '🔊';
            });

            // Customization Modal
            const modal = document.getElementById('customize-modal');
            document.getElementById('customize-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                modal.classList.remove('hidden');
            });
            document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('school-name-input').value = btn.dataset.preset;
                    state.capEmblem = btn.dataset.emblem;
                });
            });

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-btn').forEach(b => {
                        b.className = 'color-btn h-9 rounded-xl opacity-75 hover:opacity-100 transition cursor-pointer';
                        b.style.backgroundColor = b.dataset.color;
                    });
                    btn.className = 'color-btn h-9 rounded-xl ring-2 ring-white scale-105 transition cursor-pointer';
                    state.teamColor = btn.dataset.color;
                });
            });

            document.querySelectorAll('.bat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.bat-btn').forEach(b => {
                        b.className = 'bat-btn p-2.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:border-slate-500 text-left transition cursor-pointer';
                    });
                    btn.className = 'bat-btn p-2.5 rounded-xl border-2 border-amber-400 bg-amber-400/15 text-left transition cursor-pointer';
                    state.batType = btn.dataset.bat;
                });
            });

            document.getElementById('reset-best-btn').addEventListener('click', () => {
                state.bestDistance = 0;
                state.homeRunCount = 0;
                state.hitCount = 0;
                document.getElementById('hud-best-distance').textContent = '0.00m';
                document.getElementById('hud-hr-count').textContent = '0';
                document.getElementById('hud-hit-count').textContent = '0';
                try { localStorage.removeItem(STORAGE_KEY_BEST); } catch (e) {}
                update3DScoreboard();
            });

            document.getElementById('apply-modal-btn').addEventListener('click', () => {
                const name = document.getElementById('school-name-input').value.trim();
                state.schoolName = name || '세이도 고교';
                document.getElementById('hud-school-name').textContent = state.schoolName;
                document.getElementById('hud-school-dot').style.backgroundColor = state.teamColor;
                if (batter3D) batter3D.updateAppearance(state.teamColor, state.capEmblem, state.batType === 'wood');
                updateSpectatorColors();
                update3DScoreboard();
                modal.classList.add('hidden');
            });

            window.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('hidden')) return;
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    handlePrimaryAction();
                }
            });

            window.addEventListener('resize', () => {
                if (!renderer || !camera) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight, false);
            });
        }

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const rawDt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            if (state.hitstopTimer > 0) {
                state.hitstopTimer -= rawDt;
                if (threeReady && renderer && scene && camera) renderer.render(scene, camera);
                return;
            }

            if (threeReady) {
                stepSimulation(rawDt, now / 1000);
                renderer.render(scene, camera);
            }
        }

        window.onload = function () {
            document.getElementById('hud-best-distance').textContent = `${state.bestDistance.toFixed(2)}m`;
            initThreeScene();
            bindEvents();
            resetToReadyState(false);
            requestAnimationFrame(animate);
        };
    </script>
