<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지질시대 추리 카드 대전</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #12131C; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    
    #lobby { background: #1E1F2C; padding: 25px; border-radius: 12px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5); margin-top: 40px; }
    .input-group { margin: 15px 0; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #0A0A0F; color: #fff; font-size: 16px; }
    button { padding: 12px 20px; border: none; border-radius: 6px; background: #4F46E5; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #3730A3; }
    button:disabled { background: #333; cursor: not-allowed; }

    #game-board { display: none; width: 100%; max-width: 900px; flex-direction: column; gap: 15px; }
    .player-zone { background: #1E1F2C; border-radius: 12px; padding: 15px; border: 2px solid #333; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .hp-bar-bg { width: 60%; background: #333; height: 18px; border-radius: 9px; overflow: hidden; }
    .hp-bar-fill { background: #EF4444; height: 100%; width: 100%; transition: width 0.3s; }

    #battle-field { background: #0F1017; border: 2px dashed #374151; border-radius: 12px; height: 210px; display: flex; justify-content: center; align-items: center; gap: 20px; position: relative; }
    .field-section { display: flex; flex-direction: column; align-items: center; gap: 5px; }

    .card-list { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; min-height: 180px; }
    
    .card { width: 110px; height: 165px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 6px; font-size: 11px; cursor: pointer; user-select: none; border: 2px solid #6B7280; transition: transform 0.2s; background: #2A2C3D; flex-shrink: 0; position: relative; }
    .card:hover { transform: translateY(-5px); }
    .card.selected { border-color: #FBBF24; transform: translateY(-8px); box-shadow: 0 0 10px #FBBF24; }
    .card.disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    .card.ATTACK { border-color: #EF4444; }
    .card.DEFENSE { border-color: #3B82F6; }
    .card.SPECIAL { border-color: #EC4899; }
    .card.ULTIMATE { border-color: #F59E0B; background: linear-gradient(135deg, #3B125C 0%, #1E1F2C 100%); box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }

    .card-type-tag { font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.15); display: inline-block; text-align: center; }
    .card-title { font-weight: bold; font-size: 11px; margin: 3px 0; word-break: keep-all; text-align: center; }
    
    /* 이모티콘 아이콘 영역 디자인 */
    .card-icon { width: 100%; height: 50px; border-radius: 6px; background: rgba(0,0,0,0.25); margin: 2px 0; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; font-size: 28px; }
    
    .card-desc { font-size: 9px; color: #bbb; line-height: 1.2; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-val { font-size: 14px; font-weight: bold; text-align: right; color: #FFD700; }

    #action-bar { display: flex; justify-content: space-between; align-items: center; background: #1E1F2C; padding: 12px 15px; border-radius: 8px; }
    #log { background: #0A0A0F; padding: 10px; border-radius: 6px; height: 85px; overflow-y: auto; font-size: 12px; color: #D1D5DB; margin-top: 5px; width: 100%; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="lobby">
    <h2>🌋 지질시대 추리 카드 대전</h2>
    <p style="margin-top:8px; font-size: 13px; color: #9CA3AF;">화석과 힌트를 보고 시대에 맞춰 공격과 방어를 펼쳐보세요!</p>
    <div style="margin: 15px 0; background: #0A0A0F; padding: 10px; border-radius: 6px;">
      <span>내 접속 ID: </span><b id="my-id" style="color: #10B981;">생성 중...</b>
    </div>
    <div class="input-group">
      <input type="text" id="peer-id-input" placeholder="상대방 ID 입력">
      <button onclick="connectToPeer()">연결하기</button>
    </div>
    <p id="status-msg" style="color: #FBBF24; font-size: 13px;"></p>
  </div>

  <div id="game-board">
    <div class="player-zone" id="opponent-zone">
      <div class="status-bar">
        <h3>상대 플레이어 (<span id="opponent-role">-</span>)</h3>
        <div>HP: <span id="opponent-hp">100</span>/100</div>
      </div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="opponent-hp-bar"></div></div>
      <div style="margin-top: 5px; font-size: 12px; color: #9CA3AF;">남은 카드: <span id="opponent-card-count">6</span>장</div>
    </div>

    <div id="battle-field">
      <div class="field-section">
        <span style="font-size: 11px; color: #EF4444; font-weight: bold;">공격 카드</span>
        <div id="attack-cards-slot" style="display:flex; gap:5px;"></div>
      </div>
      <div style="font-size: 20px; font-weight: bold; color: #4B5563;">VS</div>
      <div class="field-section">
        <span style="font-size: 11px; color: #3B82F6; font-weight: bold;">방어 카드</span>
        <div id="defense-cards-slot" style="display:flex; gap:5px;"></div>
      </div>
    </div>

    <div class="player-zone" id="my-zone">
      <div class="status-bar">
        <h3>나 (<span id="my-role">-</span>)</h3>
        <div>HP: <span id="my-hp">100</span>/100</div>
      </div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="my-hp-bar"></div></div>
      
      <p style="margin: 8px 0 4px 0; font-size: 13px; font-weight: bold;">내 손패 (<span id="my-card-count">0</span>/10)</p>
      <div class="card-list" id="my-hand"></div>
    </div>

    <div id="action-bar">
      <span id="turn-indicator" style="font-weight: bold; color: #FBBF24; font-size: 13px;">대기 중...</span>
      <div>
        <button id="btn-submit" onclick="submitSelectedCards()" disabled>카드 제출</button>
        <button id="btn-draw" onclick="passAndDraw()" disabled style="background:#4B5563;">드로우 & Pass</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

<script>
  const CARD_DATABASE = {
    ATTACK: [
      { name: '스트로마톨라이트', era: '선캄브리아', val: 18, desc: '바다 속 최초 생명체 흔적', icon: '🪨' },
      { name: '에디아카라 동물군', era: '선캄브리아', val: 20, desc: '최초의 다세포 생물군', icon: '🪸' },
      { name: '남세균 대증식', era: '선캄브리아', val: 22, desc: '산소 농도를 급격히 증가시킴', icon: '🦠' },
      { name: '삼엽충 습격', era: '고생대', val: 24, desc: '바다 속을 누비는 대표 무척추동물', icon: '🦂' },
      { name: '갑주어 돌진', era: '고생대', val: 26, desc: '단단한 골격 투구를 쓴 어류', icon: '🐟' },
      { name: '양치식물 무성', era: '고생대', val: 25, desc: '육상에 거대한 삼림을 이룸', icon: '🌿' },
      { name: '공룡 포효', era: '중생대', val: 28, desc: '육상을 완전히 지배한 파충류', icon: '🦖' },
      { name: '암모나이트', era: '중생대', val: 23, desc: '바다 속을 지배한 나선형 화석', icon: '🐚' },
      { name: '시조새 비상', era: '중생대', val: 27, desc: '파충류와 조류의 특징을 가짐', icon: '🦅' },
      { name: '매머드 돌진', era: '신생대', val: 27, desc: '빙하기 환경에 적응한 대형 포유류', icon: '🐘' },
      { name: '화패석 분출', era: '신생대', val: 22, desc: '동전 모양의 대형 유공충 화석', icon: '🪙' },
      { name: '인류의 조상', era: '신생대', val: 29, desc: '제4기에 최초로 출현', icon: '🧍' }
    ],
    DEFENSE: [
      { name: '최초의 오존층', era: '선캄브리아', val: 18, desc: '자외선 차단의 첫 기틀 마련', icon: '🛡️' },
      { name: '바다 속 생명 지대', era: '선캄브리아', val: 16, desc: '자외선을 피해 바다에서 방어', icon: '🌊' },
      { name: '온난 환경', era: '선캄브리아', val: 15, desc: '전반적으로 따뜻했던 환경', icon: '☀️' },
      { name: '필석의 장막', era: '고생대', val: 22, desc: '바다 속 부유 생물의 방어선', icon: '🪨' },
      { name: '방추충 장벽', era: '고생대', val: 23, desc: '고생대 말 바다의 대표 화석', icon: '🧱' },
      { name: '오존층 차단막', era: '고생대', val: 25, desc: '육상 생물이 출현할 수 있게 됨', icon: '🌌' },
      { name: '겉씨식물 숲', era: '중생대', val: 22, desc: '소나무, 은행나무의 무성한 삼림', icon: '🌲' },
      { name: '파충류의 번성', era: '중생대', val: 26, desc: '온난 건조한 환경 속 방어망', icon: '🐊' },
      { name: '대륙 분리', era: '중생대', val: 24, desc: '판게아가 분리되며 해양 확장', icon: '🗺️' },
      { name: '속씨식물 장막', era: '신생대', val: 23, desc: '단풍나무, 밤나무 등의 번성', icon: '🍁' },
      { name: '포유류 대번성', era: '신생대', val: 25, desc: '다양한 환경에 적응한 포유류', icon: '🐺' },
      { name: '산맥 형성', era: '신생대', val: 28, desc: '알프스, 히말라야 산맥 솟아오름', icon: '🏔️' }
    ],
    SPECIAL: [
      { name: '빙하기', era: ['고생대', '신생대'], val: 0, targetRole: 'ATTACKER', desc: '공격 전용(고생대/신생대): 상대 턴 스킵', icon: '❄️' },
      { name: '운석 충돌', era: ['중생대'], val: 40, targetRole: 'ATTACKER', desc: '공격 전용(중생대): 확정 40 피해', icon: '☄️' },
      { name: '판게아 형성', era: ['고생대'], val: 0, targetRole: 'DEFENDER', desc: '방어 전용(고생대): 피해 반사', icon: '🌍' }
    ],
    ULTIMATE: [
      { name: '대멸종', era: '전시대', val: 50, targetRole: 'ATTACKER', desc: '★궁극기(공격): 방어 무관 확정 50 피해', icon: '💥' },
      { name: '새로운 시대', era: '전시대', val: 50, targetRole: 'DEFENDER', desc: '★궁극기(방어): 확정 방어 50 제공', icon: '✨' }
    ]
  };

  let peer, conn;
  let isHost = false;
  let myRole = ''; 
  let isMyTurn = false;

  let myGameState = { hp: 100, hand: [] };
  let opponentGameState = { hp: 100, cardCount: 6 };
  
  let selectedCardIndices = [];
  let currentAttackCards = [];

  peer = new Peer();
  peer.on('open', (id) => { document.getElementById('my-id').innerText = id; });
  peer.on('connection', (connection) => { conn = connection; isHost = true; setupConnection(); });

  function connectToPeer() {
    const peerId = document.getElementById('peer-id-input').value.trim();
    if (!peerId) return alert('상대방 ID를 입력하세요!');
    conn = peer.connect(peerId);
    isHost = false;
    setupConnection();
  }

  function setupConnection() {
    document.getElementById('status-msg').innerText = '연결 중...';
    conn.on('open', () => {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-board').style.display = 'flex';
      addLog('상대방과 연결되었습니다!');
      
      if (isHost) {
        const coinFlip = Math.random() < 0.5;
        initGame(coinFlip ? 'ATTACKER' : 'DEFENDER');
        conn.send({ type: 'INIT', role: coinFlip ? 'DEFENDER' : 'ATTACKER' });
      }
    });
    conn.on('data', (data) => handleData(data));
  }

  function initGame(role) {
    myRole = role;
    myGameState.hp = 100;
    myGameState.hand = [];
    
    // 초기 손패 6장 드로우 (7% 확률 궁극기 적용)
    const initialTypes = ['ATTACK', 'ATTACK', 'ATTACK', 'DEFENSE', 'DEFENSE', 'SPECIAL'];
    initialTypes.forEach(t => myGameState.hand.push(drawCardWithProbability(t)));

    isMyTurn = (myRole === 'ATTACKER');
    updateUI();
    addLog(`게임 시작! 당신은 [${myRole === 'ATTACKER' ? '선공(공격자)' : '후공(방어자)'}] 입니다.`);
  }

  // 7% 확률 궁극기 드로우 판정
  function drawCardWithProbability(preferredType) {
    const isUltimate = Math.random() < 0.07;
    if (isUltimate) {
      const pool = CARD_DATABASE.ULTIMATE;
      const template = pool[Math.floor(Math.random() * pool.length)];
      return { ...template, type: 'ULTIMATE' };
    } else {
      const pool = CARD_DATABASE[preferredType];
      const template = pool[Math.floor(Math.random() * pool.length)];
      return { ...template, type: preferredType };
    }
  }

  function handleData(data) {
    if (data.type === 'INIT') {
      initGame(data.role);
    } else if (data.type === 'ATTACK_SUBMIT') {
      currentAttackCards = data.cards;
      renderFieldCards('attack-cards-slot', currentAttackCards);
      opponentGameState.cardCount = data.opponentHandCount;
      addLog(`상대가 공격 카드를 제출했습니다. 알맞은 방어 카드를 선택하거나 패스하세요.`);
      isMyTurn = true;
      updateUI();
    } else if (data.type === 'DEFENSE_SUBMIT') {
      renderFieldCards('defense-cards-slot', data.cards);
      opponentGameState.cardCount = data.opponentHandCount;
      resolveBattle(currentAttackCards, data.cards);
    } else if (data.type === 'PASS_DRAW') {
      opponentGameState.cardCount = data.opponentHandCount;
      if (data.role === 'ATTACKER') {
        addLog('공격자가 카드를 내지 않고 1장을 드로우했습니다.');
        switchRoles(false);
      } else {
        addLog('방어자가 카드를 내지 않고 1장을 드로우했습니다.');
        resolveBattle(currentAttackCards, []);
      }
    }
  }

  function toggleSelectCard(index) {
    if (!isMyTurn) return;
    const card = myGameState.hand[index];

    if (myRole === 'ATTACKER') {
      if (card.type === 'DEFENSE') return alert('공격 턴에는 방어 카드를 쓸 수 없습니다!');
      if (card.type === 'SPECIAL' && card.targetRole === 'DEFENDER') return alert('판게아 형성 카드는 방어 시에만 사용 가능합니다!');
      if (card.type === 'ULTIMATE' && card.targetRole === 'DEFENDER') return alert('새로운 시대(방어 궁극기) 카드는 방어 시에만 사용 가능합니다!');
    }
    if (myRole === 'DEFENDER') {
      if (card.type === 'ATTACK') return alert('방어 턴에는 공격 카드를 쓸 수 없습니다!');
      if (card.type === 'SPECIAL' && card.targetRole === 'ATTACKER') return alert('빙하기/운석 충돌 카드는 공격 시에만 사용 가능합니다!');
      if (card.type === 'ULTIMATE' && card.targetRole === 'ATTACKER') return alert('대멸종(공격 궁극기) 카드는 공격 시에만 사용 가능합니다!');
    }

    const selIndex = selectedCardIndices.indexOf(index);
    if (selIndex > -1) {
      selectedCardIndices.splice(selIndex, 1);
    } else {
      if (selectedCardIndices.length >= 2) return alert('최대 2장까지만 선택 가능합니다.');
      
      const currentSelectedCards = selectedCardIndices.map(i => myGameState.hand[i]);
      const newPotentialSelection = [...currentSelectedCards, card];
      
      const specialCard = newPotentialSelection.find(c => c.type === 'SPECIAL');
      const normalCard = newPotentialSelection.find(c => c.type === 'ATTACK' || c.type === 'DEFENSE');

      if (specialCard && normalCard) {
        if (!specialCard.era.includes(normalCard.era)) {
          return alert(`[시대 불일치] '${specialCard.name}' 특수 카드는 [${specialCard.era.join(', ')}] 시대 카드하고만 조합하여 사용할 수 있습니다!`);
        }
      }

      selectedCardIndices.push(index);
    }
    renderHand();
    updateButtons();
  }

  function submitSelectedCards() {
    if (selectedCardIndices.length === 0) return;

    selectedCardIndices.sort((a,b) => b - a);
    const playedCards = selectedCardIndices.map(i => myGameState.hand.splice(i, 1)[0]);
    selectedCardIndices = [];

    if (myRole === 'ATTACKER') {
      currentAttackCards = playedCards;
      renderFieldCards('attack-cards-slot', currentAttackCards);
      isMyTurn = false;
      updateUI();
      
      conn.send({ type: 'ATTACK_SUBMIT', cards: playedCards, opponentHandCount: myGameState.hand.length });
      addLog('공격 카드를 제출했습니다.');
    } else {
      renderFieldCards('defense-cards-slot', playedCards);
      conn.send({ type: 'DEFENSE_SUBMIT', cards: playedCards, opponentHandCount: myGameState.hand.length });
      resolveBattle(currentAttackCards, playedCards);
    }
  }

  function passAndDraw() {
    if (!isMyTurn) return;

    if (myGameState.hand.length < 10) {
      const types = ['ATTACK', 'DEFENSE', 'SPECIAL'];
      const drawnCard = drawCardWithProbability(types[Math.floor(Math.random() * types.length)]);
      myGameState.hand.push(drawnCard);
      
      if (drawnCard.type === 'ULTIMATE') {
        addLog(`🌟 [궁극기 획득!] 7% 확률을 뚫고 궁극기 카드 [${drawnCard.name}]를 뽑았습니다!`);
      } else {
        addLog('카드를 1장 드로우했습니다.');
      }
    }
    isMyTurn = false;
    
    const currentRole = myRole;
    conn.send({ type: 'PASS_DRAW', role: currentRole, opponentHandCount: myGameState.hand.length });

    if (currentRole === 'ATTACKER') {
      switchRoles(false);
    } else {
      resolveBattle(currentAttackCards, []);
    }
  }

  function resolveBattle(attackCards, defenseCards) {
    let normalAtkVal = 0;
    let meteorDmg = 0;
    let extinctionDmg = 0;
    let isPangaea = false;
    let freezeApplied = false;

    attackCards.forEach(c => {
      if (c.type === 'ATTACK') normalAtkVal += c.val;
      if (c.name === '운석 충돌') meteorDmg = 40;
      if (c.name === '대멸종') extinctionDmg = 50;
      if (c.name === '빙하기') freezeApplied = true;
    });

    let totalDefVal = 0;
    let hasSpecialDefense = false;
    let eraMatched = false;
    let mainAtkEra = attackCards.find(c => c.type === 'ATTACK')?.era;

    defenseCards.forEach(c => {
      if (c.type === 'DEFENSE') {
        if (mainAtkEra && c.era === mainAtkEra) {
          totalDefVal += c.val;
          eraMatched = true;
        }
      }
      if (c.name === '새로운 시대') {
        totalDefVal += 50;
        eraMatched = true;
      }
      if (c.type === 'SPECIAL') {
        hasSpecialDefense = true;
        if (c.name === '판게아 형성') isPangaea = true;
      }
    });

    let normalDamage = 0;

    if (attackCards.some(c => c.type === 'ATTACK')) {
      if (hasSpecialDefense) {
        normalDamage = Math.max(0, normalAtkVal - (defenseCards.some(c => c.name === '새로운 시대') ? 50 : 0));
        addLog(`✨ [특수 방어] 특수 카드를 사용하여 일반 공격을 방어했습니다.`);
      } else if (defenseCards.length === 0) {
        normalDamage = normalAtkVal;
        addLog(`🛡️ [방어 패스] 방어 카드를 내지 않았습니다. 일반 공격 기본 피해(${normalDamage})를 받습니다.`);
      } else if (eraMatched) {
        normalDamage = Math.max(0, normalAtkVal - totalDefVal);
        addLog(`⭕ [방어 성공!] (일반 공격력 ${normalAtkVal} - 방어력 ${totalDefVal} = 피해량 ${normalDamage})`);
      } else {
        normalDamage = normalAtkVal * 2;
        addLog(`❌ [시대 불일치!] 방어 실패로 일반 공격 카드 피해가 2배(${normalDamage})로 증폭됩니다.`);
      }
    }

    if (meteorDmg > 0) {
      addLog(`☄️ [운석 충돌] 방어 여부와 관계없이 운석 충돌 확정 피해 ${meteorDmg}가 추가 정산됩니다.`);
    }

    if (extinctionDmg > 0) {
      addLog(`💥 [대멸종!] 궁극기 효과로 방어 여부와 관계없이 확정 피해 ${extinctionDmg}가 추가 정산됩니다.`);
    }

    const finalDamage = meteorDmg + extinctionDmg + normalDamage;

    if (myRole === 'DEFENDER') {
      myGameState.hp = Math.max(0, myGameState.hp - finalDamage);
      if (isPangaea) {
        opponentGameState.hp = Math.max(0, opponentGameState.hp - finalDamage);
        addLog(`🌍 [판게아 형성] 피해 반사! 상대에게도 총 피해량(${finalDamage})을 그대로 반사했습니다.`);
      }
    } else {
      opponentGameState.hp = Math.max(0, opponentGameState.hp - finalDamage);
      if (isPangaea) {
        myGameState.hp = Math.max(0, myGameState.hp - finalDamage);
        addLog(`🌍 [판게아 형성] 피해 반사! 상대가 피해를 반사하여 나도 ${finalDamage}의 피해를 입었습니다.`);
      }
    }

    if (myGameState.hp <= 0 || opponentGameState.hp <= 0) {
      setTimeout(() => {
        if (myGameState.hp <= 0 && opponentGameState.hp <= 0) alert('무승부입니다!');
        else if (myGameState.hp <= 0) alert('패배했습니다...');
        else alert('🎉 승리했습니다!');
        location.reload();
      }, 500);
      return;
    }

    setTimeout(() => {
      clearField();
      switchRoles(freezeApplied);
    }, 2800);
  }

  function switchRoles(freezeApplied) {
    if (freezeApplied) {
      addLog('❄️ [빙하기 발동!] 공격자의 다음 공격 턴이 얼어붙어 연속 공격 권한을 유지합니다!');
      isMyTurn = (myRole === 'ATTACKER');
    } else {
      myRole = (myRole === 'ATTACKER') ? 'DEFENDER' : 'ATTACKER';
      isMyTurn = (myRole === 'ATTACKER');
    }

    selectedCardIndices = [];
    updateUI();
    addLog(`--- 턴 교대! 현재 내 역할: [${myRole === 'ATTACKER' ? '공격자' : '방어자'}] ---`);
  }

  function updateUI() {
    document.getElementById('my-role').innerText = myRole === 'ATTACKER' ? '공격자' : '방어자';
    document.getElementById('opponent-role').innerText = myRole === 'ATTACKER' ? '방어자' : '공격자';

    document.getElementById('my-hp').innerText = myGameState.hp;
    document.getElementById('my-hp-bar').style.width = myGameState.hp + '%';
    document.getElementById('opponent-hp').innerText = opponentGameState.hp;
    document.getElementById('opponent-hp-bar').style.width = opponentGameState.hp + '%';

    document.getElementById('my-card-count').innerText = myGameState.hand.length;
    document.getElementById('opponent-card-count').innerText = opponentGameState.cardCount;

    document.getElementById('turn-indicator').innerText = isMyTurn 
      ? (myRole === 'ATTACKER' ? '내 차례: 공격/특수/궁극기 카드를 선택하거나 드로우하세요.' : '내 차례: 알맞은 방어/특수/궁극기 카드를 내거나 드로우&Pass 하세요.')
      : '상대방의 선택을 기다리는 중...';

    renderHand();
    updateButtons();
  }

  function renderHand() {
    const handEl = document.getElementById('my-hand');
    handEl.innerHTML = '';
    myGameState.hand.forEach((card, idx) => {
      const cardEl = document.createElement('div');
      const isSelected = selectedCardIndices.includes(idx);
      
      let disabled = !isMyTurn;
      if (myRole === 'ATTACKER') {
        if (card.type === 'DEFENSE') disabled = true;
        if (card.type === 'SPECIAL' && card.targetRole === 'DEFENDER') disabled = true;
        if (card.type === 'ULTIMATE' && card.targetRole === 'DEFENDER') disabled = true;
      }
      if (myRole === 'DEFENDER') {
        if (card.type === 'ATTACK') disabled = true;
        if (card.type === 'SPECIAL' && card.targetRole === 'ATTACKER') disabled = true;
        if (card.type === 'ULTIMATE' && card.targetRole === 'ATTACKER') disabled = true;
      }

      let typeTagText = '공격';
      if (card.type === 'DEFENSE') typeTagText = '방어';
      if (card.type === 'SPECIAL') typeTagText = '특수';
      if (card.type === 'ULTIMATE') typeTagText = '★궁극기';

      cardEl.className = `card ${card.type} ${isSelected ? 'selected' : ''} ${disabled ? 'disabled' : ''}`;
      cardEl.innerHTML = `
        <div><span class="card-type-tag">${typeTagText}</span></div>
        <div class="card-title">${card.name}</div>
        <div class="card-icon">${card.icon}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-val">${card.val > 0 ? card.val : ''}</div>
      `;
      cardEl.onclick = () => toggleSelectCard(idx);
      handEl.appendChild(cardEl);
    });
  }

  function renderFieldCards(slotId, cards) {
    const slot = document.getElementById(slotId);
    slot.innerHTML = '';
    cards.forEach(card => {
      const el = document.createElement('div');
      let typeTagText = '공격';
      if (card.type === 'DEFENSE') typeTagText = '방어';
      if (card.type === 'SPECIAL') typeTagText = '특수';
      if (card.type === 'ULTIMATE') typeTagText = '★궁극기';

      el.className = `card ${card.type}`;
      el.style.cursor = 'default';
      el.innerHTML = `
        <div><span class="card-type-tag">${typeTagText}</span></div>
        <div class="card-title">${card.name}</div>
        <div class="card-icon">${card.icon}</div>
        <div class="card-val">${card.val > 0 ? card.val : ''}</div>
      `;
      slot.appendChild(el);
    });
  }

  function clearField() {
    document.getElementById('attack-cards-slot').innerHTML = '';
    document.getElementById('defense-cards-slot').innerHTML = '';
    currentAttackCards = [];
  }

  function updateButtons() {
    document.getElementById('btn-submit').disabled = !isMyTurn || selectedCardIndices.length === 0;
    document.getElementById('btn-draw').disabled = !isMyTurn;
  }

  function addLog(msg) {
    const logEl = document.getElementById('log');
    logEl.innerHTML += `<div>• ${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
  }
</script>
</body>
</html>
