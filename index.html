<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지질시대 추리 카드 대전</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #101827;
  color: white;
}

button {
  cursor: pointer;
  border: none;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* 로비 */

#lobby {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.lobby-box {
  width: 100%;
  max-width: 600px;
  background: #1b2638;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 40px #0008;
}

h1 {
  text-align: center;
  margin-top: 0;
}

.id-box {
  background: #0d1421;
  border-radius: 12px;
  padding: 15px;
  margin: 20px 0;
}

.my-id {
  font-size: 20px;
  font-weight: bold;
  word-break: break-all;
  margin-top: 8px;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #27364c;
  margin: 15px 0;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #56657c;
  background: #101827;
  color: white;
  font-size: 16px;
  margin-bottom: 10px;
}

.main-btn {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

/* 게임 */

#game {
  display: none;
}

.top {
  display: grid;
  grid-template-columns: 1fr 100px 1fr;
  gap: 15px;
  align-items: center;
  margin-bottom: 20px;
}

.player {
  background: #1b2638;
  border-radius: 15px;
  padding: 15px;
}

.player.right {
  text-align: right;
}

.hp-bar {
  height: 20px;
  background: #111827;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.hp {
  height: 100%;
  background: #22c55e;
  transition: width .3s;
}

.vs {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
}

#turn-info {
  text-align: center;
  padding: 12px;
  background: #27364c;
  border-radius: 10px;
  margin-bottom: 20px;
}

/* 카드 */

.hand {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.card {
  width: 150px;
  min-height: 210px;
  background: #25344a;
  border: 2px solid #52647d;
  border-radius: 15px;
  padding: 12px;
  transition: .2s;
  position: relative;
}

.card:hover {
  transform: translateY(-5px);
}

.card.selected {
  border-color: #facc15;
  box-shadow: 0 0 18px #facc1577;
  transform: translateY(-8px);
}

.card.attack {
  border-color: #ef4444;
}

.card.defense {
  border-color: #3b82f6;
}

.card.special {
  border-color: #a855f7;
}

.card.ultimate {
  border-color: #f59e0b;
  background: linear-gradient(145deg, #38230b, #251b0c);
  box-shadow: 0 0 15px #f59e0b55;
}

.card-icon {
  height: 90px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
}

.card-name {
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  margin: 8px 0;
}

.card-type {
  text-align: center;
  font-size: 13px;
  color: #cbd5e1;
}

.card-value {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-top: 10px;
}

.ultimate-rate {
  text-align: center;
  color: #fbbf24;
  font-size: 12px;
  margin-top: 5px;
}

.controls {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.controls button {
  padding: 13px 22px;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  background: #334155;
}

.controls button.primary {
  background: #2563eb;
}

.controls button.danger {
  background: #dc2626;
}

.controls button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.log {
  background: #0d1421;
  border-radius: 12px;
  padding: 15px;
  margin-top: 20px;
  min-height: 100px;
  max-height: 180px;
  overflow-y: auto;
}

.deck-info {
  text-align: center;
  margin: 15px 0;
  color: #cbd5e1;
}

/* 궁극기 설명 */

.ultimate-info {
  background: #241a0b;
  border: 1px solid #f59e0b;
  border-radius: 12px;
  padding: 12px;
  margin-top: 15px;
  color: #fde68a;
}

/* 모바일 */

@media(max-width:700px) {
  .container {
    padding: 10px;
  }

  .top {
    grid-template-columns: 1fr 50px 1fr;
  }

  .vs {
    font-size: 20px;
  }

  .card {
    width: 135px;
    min-height: 190px;
  }

  .card-icon {
    height: 70px;
    font-size: 45px;
  }
}
</style>
</head>

<body>

<!-- ==================== 로비 ==================== -->

<div id="lobby">
  <div class="lobby-box">

    <h1>🦖 지질시대 추리 카드 대전</h1>

    <div class="id-box">
      <div>내 접속 ID</div>
      <div class="my-id" id="my-id">ID 생성 중...</div>
      <button class="main-btn" onclick="copyID()" style="margin-top:10px;">
        ID 복사
      </button>
    </div>

    <div class="status" id="status">
      접속 ID를 생성하는 중...
    </div>

    <input
      id="opponent-id"
      placeholder="상대방의 접속 ID를 입력하세요"
    >

    <button class="main-btn" onclick="connectToOpponent()">
      상대방과 연결
    </button>

    <div class="ultimate-info">
      ⭐ 궁극기 카드 등장 확률: <b>7%</b><br>
      💥 대멸종: 방어와 관계없이 피해 50<br>
      🌎 새로운 시대: 공격과 관계없이 방어 50
    </div>

  </div>
</div>


<!-- ==================== 게임 ==================== -->

<div id="game">

<div class="container">

  <div class="top">

    <div class="player">
      <div>나</div>
      <strong id="my-hp-text">HP 100</strong>

      <div class="hp-bar">
        <div class="hp" id="my-hp"></div>
      </div>
    </div>

    <div class="vs">VS</div>

    <div class="player right">
      <div>상대방</div>
      <strong id="enemy-hp-text">HP 100</strong>

      <div class="hp-bar">
        <div class="hp" id="enemy-hp"></div>
      </div>
    </div>

  </div>

  <div id="turn-info">
    상대방과 연결 중...
  </div>

  <div class="deck-info">
    남은 카드: <span id="deck-count">40</span>
  </div>

  <h3>내 카드</h3>

  <div class="hand" id="hand"></div>

  <div class="controls">

    <button
      class="primary"
      id="attack-btn"
      onclick="submitAttack()"
      disabled>
      공격
    </button>

    <button
      onclick="passTurn()"
      id="pass-btn"
      disabled>
      카드 뽑기
    </button>

    <button
      class="danger"
      onclick="clearSelection()">
      선택 취소
    </button>

  </div>

  <div class="log" id="log"></div>

</div>

</div>


<script>

/* =========================================================
   카드 데이터
   ========================================================= */

/*
   중요:
   카드에는 ERA(시대) 데이터가 내부적으로 존재하지만
   화면에는 시대 이름을 표시하지 않는다.
*/

const NORMAL_CARDS = [

  // 공격 카드
  {
    id: "a1",
    name: "공룡의 포효",
    type: "ATTACK",
    value: 25,
    icon: "🦖"
  },

  {
    id: "a2",
    name: "바다 괴물",
    type: "ATTACK",
    value: 20,
    icon: "🦈"
  },

  {
    id: "a3",
    name: "삼엽충의 습격",
    type: "ATTACK",
    value: 15,
    icon: "🪲"
  },

  {
    id: "a4",
    name: "거대한 포유류",
    type: "ATTACK",
    value: 20,
    icon: "🦣"
  },

  // 방어 카드
  {
    id: "d1",
    name: "화석 방패",
    type: "DEFENSE",
    value: 20,
    icon: "🛡️"
  },

  {
    id: "d2",
    name: "빙하 방어",
    type: "DEFENSE",
    value: 18,
    icon: "❄️"
  },

  {
    id: "d3",
    name: "대륙 방벽",
    type: "DEFENSE",
    value: 25,
    icon: "⛰️"
  },

  // 특수 카드
  {
    id: "s1",
    name: "운석 충돌",
    type: "SPECIAL",
    value: 40,
    icon: "☄️"
  },

  {
    id: "s2",
    name: "판게아 형성",
    type: "SPECIAL",
    value: 0,
    icon: "🌍"
  },

  {
    id: "s3",
    name: "빙하기",
    type: "SPECIAL",
    value: 0,
    icon: "❄️"
  }

];


/* =========================================================
   궁극기 카드
   ========================================================= */

const ULTIMATE_CARDS = [

  {
    id: "u1",
    name: "대멸종",
    type: "ULTIMATE",
    value: 50,
    icon: "☄️💥",

    /*
       방어와 관계없이 피해 50
    */
    effect: "INSTANT_DAMAGE"
  },

  {
    id: "u2",
    name: "새로운 시대",
    type: "ULTIMATE",
    value: 50,
    icon: "🌎✨",

    /*
       공격과 관계없이 방어 50
    */
    effect: "INSTANT_DEFENSE"
  }

];


/* =========================================================
   게임 변수
   ========================================================= */

let peer = null;
let connection = null;

let myID = "";

let isHost = false;
let myTurn = false;

let myHP = 100;
let enemyHP = 100;

let myHand = [];

let selectedCards = [];

let deck = [];

let gameStarted = false;


/* =========================================================
   덱 만들기
   ========================================================= */

function createDeck() {

  deck = [];

  /*
     일반 카드는 여러 장
  */

  for (let i = 0; i < 4; i++) {

    NORMAL_CARDS.forEach(card => {

      deck.push({
        ...card,
        unique: crypto.randomUUID()
      });

    });

  }

  shuffle(deck);

}


/* =========================================================
   카드 뽑기
   ========================================================= */

/*
   일반 카드 뽑기:
   93% → 일반 카드
   7% → 궁극기 카드

   궁극기 카드가 나오면
   대멸종 / 새로운 시대 중 하나가 랜덤으로 나온다.
*/

function drawCard() {

  if (deck.length <= 0) {
    return null;
  }

  /*
     0~100 사이의 랜덤 숫자
  */

  const random = Math.random() * 100;

  if (random < 7) {

    /*
       궁극기 카드
    */

    const ultimate =
      ULTIMATE_CARDS[
        Math.floor(Math.random() * ULTIMATE_CARDS.length)
      ];

    logMessage(
      `⭐ 궁극기 카드 [${ultimate.name}]를 뽑았습니다!`
    );

    return {
      ...ultimate,
      unique: crypto.randomUUID()
    };

  }

  /*
     일반 카드
  */

  return deck.pop();
}


/* =========================================================
   초기 손패
   ========================================================= */

function drawInitialCards() {

  myHand = [];

  for (let i = 0; i < 6; i++) {

    const card = drawCard();

    if (card) {
      myHand.push(card);
    }

  }

  renderHand();
}


/* =========================================================
   셔플
   ========================================================= */

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
      [array[j], array[i]];

  }

}


/* =========================================================
   PeerJS
   ========================================================= */

function createPeer() {

  setStatus("접속 ID를 생성하는 중...");

  peer = new Peer(undefined, {

    debug: 1,

    config: {

      iceServers: [

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        }

      ]

    }

  });


  peer.on("open", id => {

    myID = id;

    document.getElementById("my-id")
      .textContent = id;

    setStatus(
      "준비 완료! 상대방에게 내 ID를 보내세요."
    );

  });


  peer.on("connection", conn => {

    connection = conn;

    isHost = true;

    setupConnection();

  });


  peer.on("error", error => {

    console.error(error);

    setStatus(
      "PeerJS 연결 오류: " + error.type
    );

  });


  peer.on("disconnected", () => {

    setStatus("서버와 연결이 끊어졌습니다.");

  });

}


/* =========================================================
   상대방 연결
   ========================================================= */

function connectToOpponent() {

  const id =
    document.getElementById("opponent-id")
      .value.trim();

  if (!id) {

    alert("상대방 ID를 입력하세요.");

    return;

  }

  if (!peer) {

    alert("내 ID가 아직 생성되지 않았습니다.");

    return;

  }

  connection =
    peer.connect(id, {
      reliable: true,
      serialization: "json"
    });

  isHost = false;

  setupConnection();

}


/* =========================================================
   연결 설정
   ========================================================= */

function setupConnection() {

  if (!connection) return;


  connection.on("open", () => {

    setStatus("상대방과 연결되었습니다.");

    if (isHost) {

      startGame();

    }

  });


  connection.on("data", data => {

    handleData(data);

  });


  connection.on("close", () => {

    setStatus("상대방과의 연결이 종료되었습니다.");

  });

}


/* =========================================================
   게임 시작
   ========================================================= */

function startGame() {

  createDeck();

  myHP = 100;
  enemyHP = 100;

  gameStarted = true;

  drawInitialCards();

  /*
     호스트가 먼저 공격
  */

  myTurn = true;

  connection.send({

    type: "GAME_START",

    hostFirst: true

  });

  showGame();

  updateUI();

}


/* =========================================================
   데이터 처리
   ========================================================= */

function handleData(data) {


  if (data.type === "GAME_START") {

    createDeck();

    myHP = 100;
    enemyHP = 100;

    gameStarted = true;

    drawInitialCards();

    /*
       호스트가 먼저이므로
       클라이언트는 대기
    */

    myTurn = false;

    showGame();

    updateUI();

    logMessage("게임이 시작되었습니다.");

  }


  /*
     공격 제출
  */

  if (data.type === "ATTACK") {

    receiveAttack(data.cards);

  }


  /*
     카드 뽑기 후 턴 넘김
  */

  if (data.type === "PASS") {

    myTurn = true;

    drawOneCard();

    updateUI();

    logMessage("상대방의 턴이 끝났습니다.");

  }


  /*
     일반 카드 결과
  */

  if (data.type === "DAMAGE") {

    enemyHP = data.enemyHP;

    myHP = data.myHP;

    myTurn = data.nextTurn;

    updateUI();

    logMessage(data.message);

  }

}


/* =========================================================
   카드 선택
   ========================================================= */

function selectCard(index) {

  if (!myTurn) {

    return;

  }

  const card = myHand[index];

  if (!card) return;


  const alreadySelected =
    selectedCards.includes(index);


  if (alreadySelected) {

    selectedCards =
      selectedCards.filter(i => i !== index);

  } else {

    /*
       최대 2장
    */

    if (selectedCards.length >= 2) {

      alert("최대 2장까지 선택할 수 있습니다.");

      return;

    }

    selectedCards.push(index);

  }

  renderHand();

}


/* =========================================================
   공격 제출
   ========================================================= */

function submitAttack() {

  if (!myTurn) {

    return;

  }

  if (selectedCards.length === 0) {

    alert("카드를 선택하세요.");

    return;

  }


  const cards =
    selectedCards.map(i => myHand[i]);


  /*
     궁극기는 시대와 관계없이
     모든 카드와 같이 사용할 수 있다.
  */

  const ultimateCards =
    cards.filter(c => c.type === "ULTIMATE");


  /*
     궁극기 사용
  */

  if (ultimateCards.length > 0) {

    /*
       궁극기 카드가 2장 선택된 경우
       두 효과를 모두 적용할 수 있도록 처리
    */

    connection.send({

      type: "ATTACK",

      cards: cards

    });

    removeSelectedCards();

    myTurn = false;

    updateUI();

    return;

  }


  /*
     일반 공격
  */

  connection.send({

    type: "ATTACK",

    cards: cards

  });


  removeSelectedCards();

  myTurn = false;

  updateUI();

}


/* =========================================================
   상대방 공격 받기
   ========================================================= */

function receiveAttack(cards) {

  let damage = 0;

  let defense = 0;

  let ultimateDamage = 0;

  let ultimateDefense = 0;


  /*
     궁극기 확인
  */

  cards.forEach(card => {

    if (
      card.type === "ULTIMATE" &&
      card.effect === "INSTANT_DAMAGE"
    ) {

      ultimateDamage += 50;

    }


    if (
      card.type === "ULTIMATE" &&
      card.effect === "INSTANT_DEFENSE"
    ) {

      ultimateDefense += 50;

    }

  });


  /*
     궁극기 피해는
     방어와 관계없이 적용
  */

  if (ultimateDamage > 0) {

    enemyHP -= ultimateDamage;

    logMessage(
      `💥 대멸종! 방어와 관계없이 ${ultimateDamage} 피해!`
    );

  }


  /*
     새로운 시대
     확정 방어 50
  */

  if (ultimateDefense > 0) {

    defense += ultimateDefense;

    logMessage(
      `🌎 새로운 시대! 확정 방어 ${ultimateDefense}!`
    );

  }


  /*
     일반 카드
  */

  const normalCards =
    cards.filter(c => c.type !== "ULTIMATE");


  const attackCards =
    normalCards.filter(c => c.type === "ATTACK");


  const defenseCards =
    normalCards.filter(c => c.type === "DEFENSE");


  const specialCards =
    normalCards.filter(c => c.type === "SPECIAL");


  /*
     공격력 계산
  */

  attackCards.forEach(card => {

    damage += card.value;

  });


  /*
     방어력 계산

     간단한 버전에서는 선택된 방어 카드의
     방어력을 합산한다.
  */

  defenseCards.forEach(card => {

    defense += card.value;

  });


  /*
     운석 충돌
     추가 피해 40
  */

  specialCards.forEach(card => {

    if (card.id === "s1") {

      damage += 40;

    }

  });


  /*
     판게아 형성
     공격 피해 반사
  */

  const hasPangea =
    specialCards.some(c => c.id === "s2");


  /*
     최종 일반 피해
  */

  let normalDamage =
    Math.max(0, damage - defense);


  /*
     새로운 시대가 있을 경우
     최대 50 방어
  */

  normalDamage =
    Math.max(0, normalDamage);


  enemyHP -= normalDamage;


  /*
     판게아 반사
  */

  if (hasPangea && normalDamage > 0) {

    myHP -= normalDamage;

    logMessage(
      `🌍 판게아 형성! ${normalDamage} 피해가 반사되었습니다.`
    );

  }


  /*
     체력 제한
  */

  enemyHP =
    Math.max(0, enemyHP);

  myHP =
    Math.max(0, myHP);


  /*
     공격을 보낸 상대에게 결과 전달
  */

  connection.send({

    type: "DAMAGE",

    enemyHP: enemyHP,

    myHP: myHP,

    nextTurn: true,

    message:
      `공격 결과: ${normalDamage} 피해`

  });


  /*
     내 턴 시작
  */

  myTurn = true;

  drawOneCard();

  updateUI();


  /*
     승패
  */

  if (enemyHP <= 0) {

    alert("상대방의 HP가 0이 되었습니다!");

  }

}


/* =========================================================
   카드 제거
   ========================================================= */

function removeSelectedCards() {

  selectedCards
    .sort((a, b) => b - a)
    .forEach(index => {

      myHand.splice(index, 1);

    });

  selectedCards = [];

}


/* =========================================================
   카드 한 장 뽑기
   ========================================================= */

function drawOneCard() {

  const card = drawCard();

  if (!card) {

    return;

  }

  myHand.push(card);

  renderHand();

}


/* =========================================================
   패스
   ========================================================= */

function passTurn() {

  if (!myTurn) return;

  /*
     카드 한 장을 뽑고
     상대에게 턴을 넘김
  */

  drawOneCard();

  myTurn = false;

  connection.send({

    type: "PASS"

  });

  updateUI();

  logMessage("카드를 뽑고 턴을 넘겼습니다.");

}


/* =========================================================
   손패 표시
   ========================================================= */

function renderHand() {

  const hand =
    document.getElementById("hand");

  hand.innerHTML = "";


  myHand.forEach((card, index) => {

    const div =
      document.createElement("div");

    div.className =
      "card " +
      card.type.toLowerCase();


    if (selectedCards.includes(index)) {

      div.classList.add("selected");

    }


    /*
       중요:
       시대 이름을 출력하지 않는다.
    */

    let valueText = "";

    if (card.type === "ATTACK") {

      valueText =
        `⚔️ ${card.value}`;

    }

    else if (card.type === "DEFENSE") {

      valueText =
        `🛡️ ${card.value}`;

    }

    else if (card.type === "SPECIAL") {

      if (card.id === "s1") {

        valueText =
          "💥 +40 피해";

      } else {

        valueText =
          "특수 효과";

      }

    }

    else if (card.type === "ULTIMATE") {

      if (card.effect === "INSTANT_DAMAGE") {

        valueText =
          "💥 확정 피해 50";

      }

      if (card.effect === "INSTANT_DEFENSE") {

        valueText =
          "🛡️ 확정 방어 50";

      }

    }


    let rate = "";

    if (card.type === "ULTIMATE") {

      rate =
        `<div class="ultimate-rate">
          궁극기 · 등장 확률 7%
        </div>`;

    }


    div.innerHTML = `

      <div class="card-icon">
        ${card.icon}
      </div>

      <div class="card-name">
        ${card.name}
      </div>

      <div class="card-type">
        ${getTypeName(card.type)}
      </div>

      <div class="card-value">
        ${valueText}
      </div>

      ${rate}

    `;


    div.onclick =
      () => selectCard(index);


    hand.appendChild(div);

  });


  document.getElementById("deck-count")
    .textContent = deck.length;

}


/* =========================================================
   카드 종류 이름
   ========================================================= */

function getTypeName(type) {

  if (type === "ATTACK") return "공격 카드";

  if (type === "DEFENSE") return "방어 카드";

  if (type === "SPECIAL") return "특수 카드";

  if (type === "ULTIMATE") return "⭐ 궁극기";

  return "";

}


/* =========================================================
   선택 취소
   ========================================================= */

function clearSelection() {

  selectedCards = [];

  renderHand();

}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

  document.getElementById("my-hp-text")
    .textContent =
    `HP ${myHP}`;

  document.getElementById("enemy-hp-text")
    .textContent =
    `HP ${enemyHP}`;


  document.getElementById("my-hp")
    .style.width =
    `${Math.max(0, myHP)}%`;

  document.getElementById("enemy-hp")
    .style.width =
    `${Math.max(0, enemyHP)}%`;


  document.getElementById("turn-info")
    .textContent =
    myTurn
      ? "🔥 내 턴입니다!"
      : "⏳ 상대방의 턴입니다.";


  document.getElementById("attack-btn")
    .disabled =
    !myTurn;


  document.getElementById("pass-btn")
    .disabled =
    !myTurn;


  renderHand();

}


/* =========================================================
   게임 화면
   ========================================================= */

function showGame() {

  document.getElementById("lobby")
    .style.display = "none";

  document.getElementById("game")
    .style.display = "block";

}


/* =========================================================
   상태 메시지
   ========================================================= */

function setStatus(text) {

  document.getElementById("status")
    .textContent = text;

}


/* =========================================================
   로그
   ========================================================= */

function logMessage(message) {

  const log =
    document.getElementById("log");

  const div =
    document.createElement("div");

  div.textContent =
    "• " + message;

  log.appendChild(div);

  log.scrollTop =
    log.scrollHeight;

}


/* =========================================================
   ID 복사
   ========================================================= */

function copyID() {

  if (!myID) return;

  navigator.clipboard.writeText(myID)
    .then(() => {

      alert("접속 ID가 복사되었습니다.");

    });

}


/* =========================================================
   시작
   ========================================================= */

window.addEventListener(
  "load",
  createPeer
);

</script>
