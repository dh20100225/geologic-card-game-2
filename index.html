.id-box {

}

#my-id {
  color: #10b981;

}

.id-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.id-buttons button {
  flex: 1;
}

.connect-area {
  margin-top: 15px;

  gap: 8px;
}

.connect-area input {

}

.status {

  color: #fbbf24;

}

#game-board {

.player-zone {

.card:hover {

.card.selected {

/* =========================================================
   PeerJS 초기화
========================================================= */

function createPeer() {

  setStatus('접속 ID를 생성하는 중...', '#fbbf24');

  document.getElementById('my-id').innerText =
    'ID 생성 중...';

  peer = new Peer(undefined, {

    debug: 1,

    config: {

      iceServers: [
        {
          urls:'stun:stun.l.google.com:19302'
        },
        {
          urls:'stun:stun1.l.google.com:19302'
        }
      ]

    }

  });


  peer.on('open', function(id) {

    console.log('Peer ID:', id);

    document.getElementById('my-id').innerText = id;

    setStatus(
      '준비 완료! 상대방에게 내 ID를 보내세요.',
      '#10b981'
    );

  });


  peer.on('error', function(error) {

    console.error('PeerJS Error:', error);

    let message = '연결 오류가 발생했습니다.';

    if(error.type === 'peer-unavailable') {
      message = '상대방 ID를 찾을 수 없습니다.';
    }

    if(error.type === 'network') {
      message = '네트워크 연결을 확인해주세요.';
    }

    if(error.type === 'server-error') {
      message = 'PeerJS 서버에 연결하지 못했습니다.';
    }

    if(error.type === 'unavailable-id') {
      message = 'ID를 사용할 수 없습니다.';
    }

    setStatus(message, '#ef4444');

  });


  peer.on('connection', function(connection) {

    if(conn && conn.open) {
      connection.close();
      return;
    }

    conn = connection;

    isHost = true;

    setupConnection();

  });


  peer.on('disconnected', function() {

    setStatus(
      'PeerJS 서버 연결이 끊어졌습니다. 재연결을 시도합니다.',
      '#fbbf24'
    );

    try {
      peer.reconnect();
    } catch(e) {
      console.error(e);
    }

  });


  peer.on('close', function() {

    setStatus(
      '접속 ID가 종료되었습니다.',
      '#ef4444'
    );

  });

}


/* =========================================================
   ID 다시 만들기
========================================================= */

function recreatePeer() {

  if(conn && conn.open) {
    conn.close();
  }

  if(peer) {
    try {
      peer.destroy();
    } catch(e) {}
  }

  conn = null;
  gameStarted = false;

  createPeer();

}


/* =========================================================
   상대방 연결
========================================================= */

function connectToPeer() {

  const input =
    document.getElementById('peer-id-input');

  const peerId =
    input.value.trim();

  if(!peerId) {

    alert('상대방 ID를 입력하세요.');

    return;
  }

  if(!peer) {

    alert('내 접속 ID가 아직 생성되지 않았습니다.');

    return;
  }

  if(peerId === peer.id) {

    alert('자기 자신의 ID에는 연결할 수 없습니다.');

    return;
  }


  setStatus(
    '상대방에게 연결하는 중...',
    '#fbbf24'
  );


  try {

    conn = peer.connect(
      peerId,
      {
        reliable:true,
        serialization:'json'
      }
    );

    isHost = false;

    setupConnection();

  } catch(error) {

    console.error(error);

    setStatus(
      '연결에 실패했습니다.',
      '#ef4444'
    );

  }

}


/* =========================================================
   연결 설정
========================================================= */

function setupConnection() {

  if(!conn) return;


  conn.on('open', function() {

    console.log('Data connection opened.');

    setStatus(
      '상대방과 연결되었습니다!',
      '#10b981'
    );

    document.getElementById('lobby').style.display =
      'none';

    document.getElementById('game-board').style.display =
      'flex';


    addLog('🟢 상대방과 연결되었습니다.');


    /*
      호스트만 게임을 시작한다.
      클라이언트는 INIT 메시지를 기다린다.
    */

    if(isHost) {

      setTimeout(function() {

        startHostGame();

      }, 500);

    }

  });


  conn.on('data', function(data) {

    console.log('받은 데이터:', data);

    handleData(data);

  });


  conn.on('close', function() {

    alert(
      '상대방과의 연결이 종료되었습니다.'
    );

    location.reload();

  });


  conn.on('error', function(error) {

    console.error('Connection error:', error);

    setStatus(
      '상대방과 연결하는 중 오류가 발생했습니다.',
      '#ef4444'
    );

  });

}


/* =========================================================
   게임 시작
========================================================= */

function startHostGame() {

  const attackerIsHost =
    Math.random() < 0.5;


  const hostRole =
    attackerIsHost
      ? 'ATTACKER'
      : 'DEFENDER';

  const guestRole =
    attackerIsHost
      ? 'DEFENDER'
      : 'ATTACKER';


  initGame(hostRole);


  conn.send({

    type:'INIT',

    role:guestRole,

    seed:Date.now()

  });

}


/* =========================================================
   초기 게임 상태
========================================================= */

function initGame(role) {

  myRole = role;

  isMyTurn =
    myRole === 'ATTACKER';

  myGameState.hp = 100;

  myGameState.hand = [

    drawRandomCard('ATTACK'),
    drawRandomCard('ATTACK'),
    drawRandomCard('ATTACK'),

    drawRandomCard('DEFENSE'),
    drawRandomCard('DEFENSE'),

    drawRandomCard('SPECIAL')

  ];

  opponentGameState = {
    hp:100,
    cardCount:6
  };

  selectedCardIndices = [];

  currentAttackCards = [];

  gameStarted = true;

  clearField();

  updateUI();

  addLog(
    `🎮 게임 시작! 당신은 [${
      myRole === 'ATTACKER'
      ? '공격자'
      : '방어자'
    }]입니다.`
  );

}


/* =========================================================
   카드 뽑기
========================================================= */

function drawRandomCard(type) {

  const pool =
    CARD_DATABASE[type];

  const template =
    pool[
      Math.floor(
        Math.random() * pool.length
      )
    ];

  return {
    ...template,
    type
  };

}


/* =========================================================
   네트워크 데이터 처리
========================================================= */

function handleData(data) {

  if(!data || !data.type) return;


  /* 게임 초기화 */

  if(data.type === 'INIT') {

    initGame(data.role);

    return;

  }


  /* 공격 카드 제출 */

  if(data.type === 'ATTACK_SUBMIT') {

    currentAttackCards =
      data.cards || [];

    opponentGameState.cardCount =
      data.opponentHandCount;

    renderFieldCards(
      'attack-cards-slot',
      currentAttackCards
    );

    addLog(
      '⚔️ 상대가 공격 카드를 제출했습니다.'
    );

    isMyTurn = true;

    updateUI();

    return;

  }


  /* 방어 카드 제출 */

  if(data.type === 'DEFENSE_SUBMIT') {

    opponentGameState.cardCount =
      data.opponentHandCount;

    renderFieldCards(
      'defense-cards-slot',
      data.cards || []
    );

    resolveBattle(
      currentAttackCards,
      data.cards || []
    );

    return;

  }


  /* 패스 */

  if(data.type === 'PASS_DRAW') {

    opponentGameState.cardCount =
      data.opponentHandCount;


    if(data.role === 'ATTACKER') {

      addLog(
        '↪️ 공격자가 드로우 후 패스했습니다.'
      );

      switchRoles(false);

    } else {

      addLog(
        '🛡️ 방어자가 드로우 후 패스했습니다.'
      );

      resolveBattle(
        currentAttackCards,
        []
      );

    }

    return;

  }

}


/* =========================================================
   카드 선택
========================================================= */

function toggleSelectCard(index) {

  if(!isMyTurn) return;

  const card =
    myGameState.hand[index];

  if(!card) return;


  /* 역할 검사 */

  if(myRole === 'ATTACKER') {

    if(card.type === 'DEFENSE') {

      alert(
        '공격 턴에는 방어 카드를 사용할 수 없습니다.'
      );

      return;
    }

    if(
      card.type === 'SPECIAL' &&
      card.targetRole === 'DEFENDER'
    ) {

      alert(
        '판게아 형성은 방어 시에만 사용할 수 있습니다.'
      );

      return;
    }

  }


  if(myRole === 'DEFENDER') {

    if(card.type === 'ATTACK') {

      alert(
        '방어 턴에는 공격 카드를 사용할 수 없습니다.'
      );

      return;
    }

    if(
      card.type === 'SPECIAL' &&
      card.targetRole === 'ATTACKER'
    ) {

      alert(
        '빙하기/운석 충돌은 공격 시에만 사용할 수 있습니다.'
      );

      return;
    }

  }


  const selected =
    selectedCardIndices.indexOf(index);


  if(selected >= 0) {

    selectedCardIndices.splice(
      selected,
      1
    );

  } else {

    if(selectedCardIndices.length >= 2) {

      alert(
        '한 번에 최대 2장까지만 사용할 수 있습니다.'
      );

      return;

    }


    const selectedCards =
      selectedCardIndices.map(
        i => myGameState.hand[i]
      );

    const newCards =
      [...selectedCards, card];


    const specialCard =
      newCards.find(
        c => c.type === 'SPECIAL'
      );

    const normalCard =
      newCards.find(
        c => c.type !== 'SPECIAL'
      );


    if(specialCard && normalCard) {

      if(
        !specialCard.era.includes(
          normalCard.era
        )
      ) {

        alert(
          `[시대 불일치]\n\n` +
          `${specialCard.name}은 ` +
          `${specialCard.era.join(', ')}` +
          ` 시대 카드와만 사용할 수 있습니다.`
        );

        return;

      }

    }


    selectedCardIndices.push(index);

  }


  renderHand();

  updateButtons();

}


/* =========================================================
   카드 제출
========================================================= */

function submitSelectedCards() {

  if(!isMyTurn) return;

  if(selectedCardIndices.length === 0) {

    alert('카드를 선택하세요.');

    return;

  }


  selectedCardIndices.sort(
    (a,b) => b-a
  );


  const playedCards =
    selectedCardIndices.map(
      i => myGameState.hand.splice(i,1)[0]
    );


  selectedCardIndices = [];


  if(myRole === 'ATTACKER') {

    currentAttackCards =
      playedCards;

    renderFieldCards(
      'attack-cards-slot',
      playedCards
    );

    isMyTurn = false;

    updateUI();


    conn.send({

      type:'ATTACK_SUBMIT',

      cards:playedCards,

      opponentHandCount:
        myGameState.hand.length

    });


    addLog(
      '⚔️ 공격 카드를 제출했습니다.'
    );

  } else {

    renderFieldCards(
      'defense-cards-slot',
      playedCards
    );


    conn.send({

      type:'DEFENSE_SUBMIT',

      cards:playedCards,

      opponentHandCount:
        myGameState.hand.length

    });


    isMyTurn = false;

    updateUI();


    resolveBattle(
      currentAttackCards,
      playedCards
    );

  }

}


/* =========================================================
   드로우 & 패스
========================================================= */

function passAndDraw() {

  if(!isMyTurn) return;


  if(myGameState.hand.length < 10) {

    const types = [
      'ATTACK',
      'DEFENSE',
      'SPECIAL'
    ];

    const randomType =
      types[
        Math.floor(
          Math.random() * types.length
        )
      ];

    myGameState.hand.push(
      drawRandomCard(randomType)
    );

    addLog(
      '🃏 카드를 1장 드로우했습니다.'
    );

  } else {

    addLog(
      '⚠️ 손패가 가득 차서 카드를 뽑지 못했습니다.'
    );

  }


  isMyTurn = false;

  updateUI();


  const currentRole =
    myRole;


  conn.send({

    type:'PASS_DRAW',

    role:currentRole,

    opponentHandCount:
      myGameState.hand.length

  });


  if(currentRole === 'ATTACKER') {

    switchRoles(false);

  } else {

    resolveBattle(
      currentAttackCards,
      []
    );

  }

}


/* =========================================================
   전투 판정
========================================================= */

function resolveBattle(
  attackCards,
  defenseCards
) {

  let normalAtkVal = 0;

  let meteorDmg = 0;

  let isPangaea = false;

  let freezeApplied = false;


  attackCards.forEach(card => {

    if(card.type === 'ATTACK') {

      normalAtkVal += card.val;

    }

    if(card.name === '운석 충돌') {

      meteorDmg = 40;

    }

    if(card.name === '빙하기') {

      freezeApplied = true;

    }

  });


  let totalDefVal = 0;

  let hasSpecialDefense = false;

  let eraMatched = false;


  const mainAtkEra =
    attackCards.find(
      c => c.type === 'ATTACK'
    )?.era;


  defenseCards.forEach(card => {

    if(card.type === 'DEFENSE') {

      if(
        mainAtkEra &&
        card.era === mainAtkEra
      ) {

        totalDefVal += card.val;

        eraMatched = true;

      }

    }


    if(card.type === 'SPECIAL') {

      hasSpecialDefense = true;

      if(card.name === '판게아 형성') {

        isPangaea = true;

      }

    }

  });


  let normalDamage = 0;


  if(
    attackCards.some(
      c => c.type === 'ATTACK'
    )
  ) {


    if(hasSpecialDefense) {

      normalDamage =
        normalAtkVal;

      addLog(
        `✨ 특수 방어! 일반 공격 피해 ${normalDamage}`
      );

    }


    else if(defenseCards.length === 0) {

      normalDamage =
        normalAtkVal;

      addLog(
        `🛡️ 방어 패스! 피해 ${normalDamage}`
      );

    }


    else if(eraMatched) {

      normalDamage =
        Math.max(
          0,
          normalAtkVal - totalDefVal
        );

      addLog(
        `⭕ 시대 일치! ` +
        `${normalAtkVal} - ${totalDefVal} = ` +
        `${normalDamage} 피해`
      );

    }


    else {

      normalDamage =
        normalAtkVal * 2;

      addLog(
        `❌ 시대 불일치! ` +
        `피해가 2배가 되어 ${normalDamage}`
      );

    }

  }


  if(meteorDmg > 0) {

    addLog(
      `☄️ 운석 충돌! 확정 피해 ${meteorDmg}`
    );

  }


  const finalDamage =
    meteorDmg + normalDamage;


  /* 피해 적용 */

  if(myRole === 'DEFENDER') {

    myGameState.hp =
      Math.max(
        0,
        myGameState.hp - finalDamage
      );


    if(isPangaea) {

      opponentGameState.hp =
        Math.max(
          0,
          opponentGameState.hp - finalDamage
        );

      addLog(
        `🌍 판게아 형성! ${finalDamage} 피해 반사`
      );

    }

  }


  else {

    opponentGameState.hp =
      Math.max(
        0,
        opponentGameState.hp - finalDamage
      );


    if(isPangaea) {

      myGameState.hp =
        Math.max(
          0,
          myGameState.hp - finalDamage
        );

      addLog(
        `🌍 판게아 형성! 피해 ${finalDamage} 반사`
      );

    }

  }


  updateUI();


  /* 승패 */

  if(
    myGameState.hp <= 0 ||
    opponentGameState.hp <= 0
  ) {

    setTimeout(() => {

      if(
        myGameState.hp <= 0 &&
        opponentGameState.hp <= 0
      ) {

        alert('🤝 무승부입니다!');

      }

      else if(myGameState.hp <= 0) {

        alert('💀 패배했습니다.');

      }

      else {

        alert('🎉 승리했습니다!');

      }

      location.reload();

    },700);

    return;

  }


  setTimeout(() => {

    clearField();

    switchRoles(
      freezeApplied
    );

  },2500);

}


/* =========================================================
   역할 교대
========================================================= */

function switchRoles(freezeApplied) {

  if(freezeApplied) {

    addLog(
      '❄️ 빙하기 발동! 공격자의 연속 공격!'
    );

    isMyTurn =
      myRole === 'ATTACKER';

  }

  else {

    myRole =
      myRole === 'ATTACKER'
        ? 'DEFENDER'
        : 'ATTACKER';

    isMyTurn =
      myRole === 'ATTACKER';

  }


  selectedCardIndices = [];

  updateUI();


  addLog(
    `--- 역할 교대: ${
      myRole === 'ATTACKER'
        ? '공격자'
        : '방어자'
    } ---`
  );

}


/* =========================================================
   UI 업데이트
========================================================= */

function updateUI() {

  document.getElementById(
    'my-role'
  ).innerText =
    myRole === 'ATTACKER'
      ? '공격자'
      : '방어자';


  document.getElementById(
    'opponent-role'
  ).innerText =
    myRole === 'ATTACKER'
      ? '방어자'
      : '공격자';


  document.getElementById(
    'my-hp'
  ).innerText =
    myGameState.hp;


  document.getElementById(
    'my-hp-bar'
  ).style.width =
    myGameState.hp + '%';


  document.getElementById(
    'opponent-hp'
  ).innerText =
    opponentGameState.hp;


  document.getElementById(
    'opponent-hp-bar'
  ).style.width =
    opponentGameState.hp + '%';


  document.getElementById(
    'my-card-count'
  ).innerText =
    myGameState.hand.length;


  document.getElementById(
    'opponent-card-count'
  ).innerText =
    opponentGameState.cardCount;


  const turn =
    document.getElementById(
      'turn-indicator'
    );


  if(isMyTurn) {

    if(myRole === 'ATTACKER') {

      turn.innerText =
        '⚔️ 내 차례: 공격 카드 또는 특수 카드를 선택하세요.';

    }

    else {

      turn.innerText =
        '🛡️ 내 차례: 방어 카드를 선택하거나 패스하세요.';

    }

  }

  else {

    turn.innerText =
      '⏳ 상대방의 선택을 기다리는 중...';

  }


  renderHand();

  updateButtons();

}


/* =========================================================
   손패 렌더링
========================================================= */

function renderHand() {

  const hand =
    document.getElementById(
      'my-hand'
    );

  hand.innerHTML = '';


  myGameState.hand.forEach(
    (card,index) => {

      const element =
        document.createElement('div');


      const selected =
        selectedCardIndices.includes(index);


      let disabled =
        !isMyTurn;


      if(myRole === 'ATTACKER') {

        if(card.type === 'DEFENSE') {

          disabled = true;

        }

        if(
          card.type === 'SPECIAL' &&
          card.targetRole === 'DEFENDER'
        ) {

          disabled = true;

        }

      }


      if(myRole === 'DEFENDER') {

        if(card.type === 'ATTACK') {

          disabled = true;

        }

        if(
          card.type === 'SPECIAL' &&
          card.targetRole === 'ATTACKER'
        ) {

          disabled = true;

        }

      }


      const typeText =
        card.type === 'ATTACK'
          ? '공격'
          : card.type === 'DEFENSE'
            ? '방어'
            : '특수';


      const eraText =
        Array.isArray(card.era)
          ? card.era.join('/')
          : card.era;


      element.className =
        `card ${card.type} ` +
        `${selected ? 'selected' : ''} ` +
        `${disabled ? 'disabled' : ''}`;


      element.innerHTML = `

        <div>
          <span class="card-type-tag">
            ${typeText}
          </span>

          <span style="
            font-size:8px;
            color:#aaa;
          ">
            (${eraText})
          </span>
        </div>

        <div class="card-title">
          ${card.name}
        </div>

        <img
          class="card-img"
          src="${card.img}"
          alt="${card.name}"
          onerror="this.style.display='none'"
        >

        <div class="card-desc">
          ${card.desc}
        </div>

        <div class="card-val">
          ${card.val > 0 ? card.val : ''}
        </div>

      `;


      element.onclick =
        () => {

          if(!disabled) {

            toggleSelectCard(index);

          }

        };


      hand.appendChild(element);

    }
  );

}


/* =========================================================
   전투 필드 카드
========================================================= */

function renderFieldCards(
  slotId,
  cards
) {

  const slot =
    document.getElementById(
      slotId
    );

  slot.innerHTML = '';


  cards.forEach(card => {

    const element =
      document.createElement('div');


    element.className =
      `card ${card.type}`;


    element.style.cursor =
      'default';


    element.innerHTML = `

      <div>
        <span class="card-type-tag">
          ${
            card.type === 'ATTACK'
              ? '공격'
              : card.type === 'DEFENSE'
                ? '방어'
                : '특수'
          }
        </span>
      </div>

      <div class="card-title">
        ${card.name}
      </div>

      <img
        class="card-img"
        src="${card.img}"
        alt="${card.name}"
        onerror="this.style.display='none'"
      >

      <div class="card-val">
        ${card.val > 0 ? card.val : ''}
      </div>

    `;


    slot.appendChild(element);

  });

}


/* =========================================================
   필드 초기화
========================================================= */

function clearField() {

  document.getElementById(
    'attack-cards-slot'
  ).innerHTML = '';


  document.getElementById(
    'defense-cards-slot'
  ).innerHTML = '';


  currentAttackCards = [];

}


/* =========================================================
   버튼 상태
========================================================= */

function updateButtons() {

  document.getElementById(
    'btn-submit'
  ).disabled =
    !isMyTurn ||
    selectedCardIndices.length === 0;


  document.getElementById(
    'btn-draw'
  ).disabled =
    !isMyTurn;

}


/* =========================================================
   로그
========================================================= */

function addLog(message) {

  const log =
    document.getElementById(
      'log'
    );


  const div =
    document.createElement('div');


  div.textContent =
    '• ' + message;


  log.appendChild(div);


  log.scrollTop =
    log.scrollHeight;

}


/* =========================================================
   상태 메시지
========================================================= */

function setStatus(
  message,
  color
) {

  const status =
    document.getElementById(
      'status-msg'
    );

  status.innerText =
    message;

  if(color) {

    status.style.color =
      color;

  }

}


/* =========================================================
   ID 복사
========================================================= */

async function copyMyId() {

  const id =
    document.getElementById(
      'my-id'
    ).innerText;


  if(
    !id ||
    id === 'ID 생성 중...'
  ) {

    alert(
      '아직 ID가 생성되지 않았습니다.'
    );

    return;

  }


  try {

    await navigator.clipboard.writeText(id);

    setStatus(
      '접속 ID가 복사되었습니다!',
      '#10b981'
    );

  }

  catch(error) {

    prompt(
      '아래 ID를 복사하세요.',
      id
    );

  }

}


/* =========================================================
   페이지 시작
========================================================= */

window.addEventListener(
  'load',
  function() {

    createPeer();

  }
);

</script>
