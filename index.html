<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여름의 고시엔 3D - 토스 배팅 에디션</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 from cdnjs with unpkg fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            onerror="var s=document.createElement('script');s.src='https://unpkg.com/three@0.128.0/build/three.min.js';document.head.appendChild(s);"></script>
    <!-- Korean Display & UI Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Noto Sans KR', sans-serif;
            background: #1d4ed8;
        }
        .font-display {
            font-family: 'Black Han Sans', sans-serif;
            letter-spacing: 0.02em;
        }
        #three-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        @keyframes promptPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        .animate-prompt {
            animation: promptPulse 1.5s ease-in-out infinite;
        }
        @keyframes judgePop {
            0% { transform: translate(-50%, -45%) scale(0.5); opacity: 0; }
            18% { transform: translate(-50%, -65%) scale(1.18); opacity: 1; }
            80% { transform: translate(-50%, -85%) scale(1.0); opacity: 1; }
            100% { transform: translate(-50%, -105%) scale(0.95); opacity: 0; }
        }
        .animate-judge {
            animation: judgePop 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes nextBtnPop {
            0% { transform: translate(-50%, 24px) scale(0.85); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }
        .animate-next-btn {
            animation: nextBtnPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-sky-500">

    <!-- ==================== FULL-VIEWPORT 3D KOSHIEN CANVAS ==================== -->
    <div id="canvas-wrapper" class="relative w-full h-full cursor-pointer">
        <canvas id="three-canvas"></canvas>

        <!-- WebGL Error Fallback -->
        <div id="webgl-error-box" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-50">
            <div class="text-4xl mb-2">⚠️</div>
            <div class="font-bold text-lg text-amber-300 mb-1">3D 그래픽 초기화 오류</div>
            <p id="webgl-error-msg" class="text-xs text-slate-300 max-w-md">브라우저의 WebGL 설정을 확인해 주세요.</p>
        </div>

        <!-- ==================== TOP HUD (MATCHING REFERENCE VIDEO) ==================== -->
        <div class="pointer-events-none absolute inset-x-0 top-0 z-20 flex flex-col items-center pt-3 sm:pt-5 px-3 sm:px-6">
            <!-- Top Row: Best Pill Badge (Left) + Mode / Home / Sound Buttons (Right) -->
            <div class="w-full max-w-5xl flex items-center justify-between gap-2">
                <!-- Left: Best Distance Pill Badge -->
                <div class="pointer-events-auto flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/80 backdrop-blur-md border border-white/25 shadow-lg">
                    <span class="text-xs sm:text-sm font-extrabold text-amber-300 tracking-tight">Best:</span>
                    <span id="hud-best-distance" class="text-sm sm:text-base font-black text-white tabular-nums">0.00m</span>
                </div>

                <!-- Right: Mode Toggle, Customize/Home Button & Audio Toggle -->
                <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2">
                    <button id="mode-toggle-btn" type="button" title="토스 배팅 / 고시엔 수비연출 전환"
                        class="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 backdrop-blur-md border border-white/25 text-xs sm:text-sm font-extrabold text-sky-300 shadow-lg transition cursor-pointer">
                        ⚾ <span id="mode-label">토스 배팅</span>
                    </button>
                    <button id="customize-btn" type="button" title="학교 유니폼 & 설정"
                        class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-sky-500/90 hover:bg-sky-400 border-2 border-white/80 flex items-center justify-center text-white text-base sm:text-lg shadow-lg transition cursor-pointer">
                        🏠
                    </button>
                    <button id="mute-btn" type="button" title="사운드 켜기/끄기"
                        class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-900/80 hover:bg-slate-800 backdrop-blur-md border border-white/25 flex items-center justify-center text-white text-base sm:text-lg shadow-lg transition cursor-pointer">
                        <span id="mute-icon">🔊</span>
                    </button>
                </div>
            </div>

            <!-- Center: Large Bold Live Distance Counter (`0.00m`) -->
            <div class="mt-1 sm:mt-2 flex flex-col items-center">
                <div id="hud-live-distance"
                    class="font-black text-5xl sm:text-6xl md:text-7xl text-slate-950 drop-shadow-[0_2px_10px_rgba(255,255,255,0.85)] tabular-nums tracking-tight leading-none">
                    0.00m
                </div>
                <!-- Sub-telemetry pill (exit speed & launch angle during flight) -->
                <div id="hud-telemetry-pill" class="hidden mt-2 px-3.5 py-1 rounded-full bg-slate-950/80 backdrop-blur-md border border-amber-300/60 text-xs sm:text-sm font-bold text-amber-300 shadow">
                    <span id="hud-telemetry-text">타구 172km/h · 발사각 32°</span>
                </div>
            </div>
        </div>

        <!-- ==================== CENTER PLATE PROMPT ("Tap to Start!" / "Tap to Swing!") ==================== -->
        <div id="center-prompt" class="pointer-events-none absolute left-1/2 top-[63%] z-20 animate-prompt text-center">
            <div id="center-prompt-main"
                class="font-black text-2xl sm:text-4xl text-slate-950 drop-shadow-[0_2px_8px_rgba(255,255,255,0.95)] whitespace-nowrap">
                Tap to Start!
            </div>
            <div id="center-prompt-sub"
                class="mt-1 inline-block px-3 py-0.5 rounded-full bg-slate-950/70 text-white text-[11px] sm:text-xs font-bold backdrop-blur-sm">
                화면 클릭 / 터치 / SPACE
            </div>
        </div>

        <!-- ==================== SWING CONTACT JUDGMENT POPUP ==================== -->
        <div id="judgment-popup" class="hidden pointer-events-none absolute left-1/2 top-[44%] z-30 text-center">
            <div id="judgment-title" class="font-display text-4xl sm:text-6xl text-amber-300 drop-shadow-[0_4px_14px_rgba(0,0,0,0.95)] whitespace-nowrap">
                PERFECT!!
            </div>
            <div id="judgment-sub" class="mt-1 px-3 py-0.5 rounded-full bg-slate-950/80 text-white text-xs sm:text-sm font-bold inline-block">
                완벽한 스윗스팟!
            </div>
        </div>

        <!-- ==================== BOTTOM-CENTER "Next" BUTTON (MATCHING VIDEO) ==================== -->
        <button id="next-btn" type="button"
            class="hidden absolute bottom-8 sm:bottom-11 left-1/2 -translate-x-1/2 z-30 px-12 sm:px-16 py-3.5 sm:py-4 rounded-2xl bg-gradient-to-b from-sky-500 to-blue-700 hover:from-sky-400 hover:to-blue-600 border-2 border-slate-950/80 text-white font-black text-2xl sm:text-3xl shadow-[0_8px_24px_rgba(0,0,0,0.45)] active:scale-95 transition cursor-pointer">
            Next
        </button>

        <!-- ==================== BOTTOM-LEFT SCHOOL & BATTER MINI BADGE ==================== -->
        <div class="pointer-events-none absolute bottom-3 left-3 z-20 hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-slate-950/75 backdrop-blur-md border border-white/20 shadow-lg">
            <span id="badge-school-color" class="w-4 h-4 rounded-md bg-blue-600 border border-white/70 inline-block"></span>
            <span id="badge-school-name" class="text-xs font-black text-white">세이도 고교</span>
            <span class="text-white/30">|</span>
            <span id="badge-hit-count" class="text-xs font-bold text-amber-300">홈런 0개</span>
        </div>
    </div>

    <!-- ==================== SCHOOL & BAT CUSTOMIZATION MODAL ==================== -->
    <div id="customize-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 shadow-2xl text-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-display text-2xl text-amber-300">⚾ 고시엔 타자 &amp; 구장 설정</h2>
                <button id="close-modal-btn" type="button" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-bold text-white cursor-pointer">닫기 ✕</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1.5">학교 이름 &amp; 모자 이니셜</label>
                    <input id="school-name-input" type="text" maxlength="10" value="세이도 고교"
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-600 text-white font-bold focus:outline-none focus:border-amber-400">
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <button type="button" data-preset="세이도 고교" data-emblem="S" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-sky-300 font-bold cursor-pointer">세이도 고교</button>
                        <button type="button" data-preset="메이세이 고교" data-emblem="星" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-sky-300 font-bold cursor-pointer">메이세이 고교</button>
                        <button type="button" data-preset="쇼호쿠 고교" data-emblem="龍" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-sky-300 font-bold cursor-pointer">쇼호쿠 고교</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1.5">유니폼 &amp; 알프스 응원단 컬러</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button type="button" data-color="#2563eb" class="color-btn h-9 rounded-xl bg-blue-600 ring-2 ring-white scale-105 transition cursor-pointer"></button>
                        <button type="button" data-color="#dc2626" class="color-btn h-9 rounded-xl bg-red-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                        <button type="button" data-color="#059669" class="color-btn h-9 rounded-xl bg-emerald-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                        <button type="button" data-color="#ea580c" class="color-btn h-9 rounded-xl bg-orange-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                        <button type="button" data-color="#7c3aed" class="color-btn h-9 rounded-xl bg-violet-600 opacity-75 hover:opacity-100 transition cursor-pointer"></button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1.5">배트 타입 선택</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" data-bat="metal" class="bat-btn p-2.5 rounded-xl border-2 border-amber-400 bg-amber-400/15 text-left transition cursor-pointer">
                            <div class="font-extrabold text-xs sm:text-sm text-white">⚡ 고시엔 금속배트</div>
                            <div class="text-[11px] text-amber-300">경쾌한 "깡!" 반발력</div>
                        </button>
                        <button type="button" data-bat="wood" class="bat-btn p-2.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:border-slate-500 text-left transition cursor-pointer">
                            <div class="font-extrabold text-xs sm:text-sm text-white">🪵 프로 나무배트</div>
                            <div class="text-[11px] text-slate-300">묵직한 장타 스윗스팟</div>
                        </button>
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                    <button id="reset-best-btn" type="button" class="px-3 py-2 rounded-xl bg-rose-950/70 hover:bg-rose-900 border border-rose-700/60 text-xs font-bold text-rose-300 cursor-pointer">
                        최고 기록 초기화
                    </button>
                    <button id="apply-modal-btn" type="button" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-sm shadow-lg cursor-pointer">
                        적용하고 돌아가기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. PROCEDURAL WEB AUDIO SYNTHESIZER (NO EXTERNAL SOUND URLS)
         * ============================================================================
         */
        class KoshienTossAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            ensureCtx() {
                if (this.muted) return null;
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume().catch(() => {});
                    }
                } catch (e) {
                    this.ctx = null;
                }
                return this.ctx;
            }
            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
            // Pneumatic Toss Machine Launch Pop
            playTossLaunch() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(420, now + 0.085);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }
            // Bat Swing Air Swoosh
            playSwingWhoosh() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.16);
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            // Crisp Metallic Koshien "KANG!" or Wood Crack scaled by hit quality
            playBatHit(quality = 1.0, isWood = false) {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                if (isWood) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(290 + quality * 140, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.16);
                    gain.gain.setValueAtTime(0.36 * (0.6 + quality * 0.4), now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.19);
                } else {
                    [1360, 2720, 4080].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = idx === 0 ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(freq * (0.95 + quality * 0.08), now);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.86, now + 0.36);
                        gain.gain.setValueAtTime((0.30 / (idx + 1)) * (0.55 + quality * 0.55), now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.39);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.41);
                    });
                }
            }
            // Aerodynamic Wind Whoosh during High Ball-Chase Flight
            playSkyWind(duration = 1.1) {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const bufferSize = Math.floor(ctx.sampleRate * duration);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(420, now);
                filter.frequency.linearRampToValueAtTime(780, now + duration * 0.5);
                filter.Q.setValueAtTime(1.4, now);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.005, now);
                gain.gain.linearRampToValueAtTime(0.09, now + duration * 0.3);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);
            }
            // Koshien Stadium Siren + Brass Fanfare & Crowd Applause on Home Run
            playHomeRunCelebration() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;

                // 1. Koshien Siren
                const siren = ctx.createOscillator();
                const sGain = ctx.createGain();
                siren.type = 'sawtooth';
                siren.frequency.setValueAtTime(260, now);
                siren.frequency.linearRampToValueAtTime(540, now + 0.5);
                siren.frequency.linearRampToValueAtTime(470, now + 1.2);
                sGain.gain.setValueAtTime(0.001, now);
                sGain.gain.linearRampToValueAtTime(0.085, now + 0.25);
                sGain.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
                siren.connect(sGain);
                sGain.connect(ctx.destination);
                siren.start(now);
                siren.stop(now + 1.4);

                // 2. Brass Trumpet Riff
                [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    const lp = ctx.createBiquadFilter();
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(2200, now);

                    osc.frequency.setValueAtTime(freq, now + i * 0.095);
                    gain.gain.setValueAtTime(0.08, now + i * 0.095);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.095 + 0.32);
                    osc.connect(lp);
                    lp.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.095);
                    osc.stop(now + i * 0.095 + 0.34);
                });

                // 3. Crowd Applause Noise
                const dur = 1.9;
                const bufSize = Math.floor(ctx.sampleRate * dur);
                const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const bp = ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.setValueAtTime(820, now);
                bp.Q.setValueAtTime(0.7, now);
                const nGain = ctx.createGain();
                nGain.gain.setValueAtTime(0.01, now);
                nGain.gain.linearRampToValueAtTime(0.2, now + 0.2);
                nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                src.connect(bp);
                bp.connect(nGain);
                nGain.connect(ctx.destination);
                src.start(now);
            }
            playFielderGlovePop() {
                const ctx = this.ensureCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(185, now);
                osc.frequency.exponentialRampToValueAtTime(48, now + 0.11);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            }
        }
        const audio = new KoshienTossAudio();

        /**
         * ============================================================================
         * 2. GAME STATE & PERSISTENCE
         * ============================================================================
         */
        const STORAGE_KEY_BEST = 'koshien_toss_batting_best_m_v1';

        const state = {
            schoolName: '세이도 고교',
            capEmblem: 'S',
            teamColor: '#2563eb',
            batType: 'metal', // 'metal' | 'wood'
            gameMode: 'toss', // 'toss' | 'defense'

            bestDistance: 0,
            homeRunCount: 0,
            currentDistance: 0,

            // Phase: 'ready_start' | 'toss_flight' | 'ball_flight' | 'result_ready'
            phase: 'ready_start',

            // Toss Machine Arc Physics
            toss: {
                timer: 0,
                duration: 0.90,
                startPos: new THREE.Vector3(0.62, 0.56, 0.02),
                vel: new THREE.Vector3(0, 0, 0),
                machineRecoil: 0
            },

            // Batter Swing Animation & Contact Window
            swing: {
                active: false,
                timer: 0,
                duration: 0.34,
                contactChecked: false
            },

            // Struck Ball 3D Aerodynamic Physics
            flight: {
                timer: 0,
                pos: new THREE.Vector3(0, 1.05, 0),
                vel: new THREE.Vector3(0, 0, 0),
                spinRate: 2200, // rpm backspin
                bounces: 0,
                landed: false,
                isHomeRun: false,
                hrCelebrated: false,
                exitVelKmh: 0,
                launchAngleDeg: 0,
                trailPoints: []
            },

            // Optional Koshien Defense Fielders Simulation ('defense' mode)
            defense: {
                retrieverIdx: 7,
                ballFielded: false,
                relayInFlight: false,
                relayProgress: 0,
                relayStart: new THREE.Vector3(),

        /**

        function getWallRadiusAtAngle(theta) {
            return 95.0 + 23.0 * Math.cos(2 * theta);

        function initThreeScene() {
            if (threeReady) return true;
            if (typeof window.THREE === 'undefined') return false;

            try {
                const canvas = document.getElementById('three-canvas');
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x38bdf8);
                scene.fog = new THREE.FogExp2(0x60a5fa, 0.0018);

                camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 600);
                camera.position.copy(HOME_CAM_POS);
                camera.lookAt(HOME_CAM_LOOK);

                renderer = new THREE.WebGLRenderer({
                    canvas,
                    antialias: true,
                    powerPreference: 'default'
                });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(window.innerWidth, window.innerHeight, false);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                // Summer Koshien Sunlight + Hemisphere Sky Lighting
                const hemi = new THREE.HemisphereLight(0xf0f9ff, 0x15803d, 0.88);
                scene.add(hemi);

                const sun = new THREE.DirectionalLight(0xfffbeb, 1.15);
                sun.position.set(48, 84, 42);
                sun.castShadow = true;
                sun.shadow.mapSize.width = 1024;
                sun.shadow.mapSize.height = 1024;

                sun.shadow.camera.far = 220;
                const d = 65;
                sun.shadow.camera.left = -d;
                sun.shadow.camera.right = d;
                sun.shadow.camera.top = d;
                sun.shadow.camera.bottom = -d;
                scene.add(sun);

                buildKoshienFieldAndDistanceArcs();
                buildHomePlatePlatformAndTossMachine();
                buildBatterAndFielders();
                buildBallRibbonAndParticles();

                threeReady = true;
                return true;
            } catch (err) {
                const box = document.getElementById('webgl-error-box');
                const msg = document.getElementById('webgl-error-msg');
                if (box && msg) {
                    msg.textContent = err && err.message ? err.message : 'WebGL 초기화 실패';
                    box.classList.remove('hidden');
                }
                return false;
            }
        }

        function createStripedGrassTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');
            for (let i = 0; i < 16; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#15803d' : '#16a34a';
                ctx.fillRect(0, i * 32, 512, 32);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(12, 12);
            return tex;
        }

        function createIvyWallTexture() {
            const c = document.createElement('canvas');
            c.width = 1024;
            c.height = 192;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#064e3b';
            ctx.fillRect(0, 0, 1024, 192);

            for (let i = 0; i < 650; i++) {
                ctx.fillStyle = i % 3 === 0 ? '#15803d' : i % 3 === 1 ? '#166534' : '#047857';
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, 22 + Math.random() * 165, 7 + Math.random() * 10, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('95m', 65, 58);
            ctx.fillText('118m', 512, 58);
            ctx.fillText('95m', 959, 58);

            ctx.fillStyle = '#facc15';
            ctx.fillRect(0, 0, 1024, 16);

            return new THREE.CanvasTexture(c);
        }

        function createDistanceLabelTexture(label) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 96;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
            ctx.beginPath();
            ctx.roundRect(24, 14, 208, 68, 22);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

        }

        function buildKoshienFieldAndDistanceArcs() {
            // 1. Striped Natural Outfield Turf
            const grassTex = createStripedGrassTexture();
            const outfield = new THREE.Mesh(
                new THREE.CircleGeometry(210, 72),
                new THREE.MeshLambertMaterial({ map: grassTex })
            );
            outfield.rotation.x = -Math.PI / 2;
            outfield.receiveShadow = true;
            scene.add(outfield);

            // 2. Kurotsuchi (Black Volcanic Soil) Infield Apron
            const kuroMat = new THREE.MeshLambertMaterial({ color: 0x2b2522 });
            const infieldDirt = new THREE.Mesh(new THREE.CircleGeometry(34.5, 56), kuroMat);
            infieldDirt.rotation.x = -Math.PI / 2;
            infieldDirt.position.set(0, 0.014, -20.5);
            infieldDirt.receiveShadow = true;
            scene.add(infieldDirt);

            // Inner Green Grass Diamond
            const innerGrass = new THREE.Mesh(
                new THREE.PlaneGeometry(23.2, 23.2),
                new THREE.MeshLambertMaterial({ color: 0x16a34a })
            );
            innerGrass.rotation.x = -Math.PI / 2;
            innerGrass.rotation.y = Math.PI / 4;
            innerGrass.position.set(0, 0.02, -19.4);
            innerGrass.receiveShadow = true;
            scene.add(innerGrass);

            // Pitcher's Mound
            const mound = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 2.75, 0.25, 32), kuroMat);
            mound.position.set(0, 0.125, -18.44);
            scene.add(mound);

            // Bases (1B, 2B, 3B)
            const baseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            [
                new THREE.Vector3(19.4, 0.04, -19.4),
                new THREE.Vector3(0, 0.04, -38.8),
                new THREE.Vector3(-19.4, 0.04, -19.4)
            ].forEach(bPos => {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.07, 0.46), baseMat);
                b.position.copy(bPos);
                b.rotation.y = Math.PI / 4;
                scene.add(b);
            });

            // Foul Lines (Left & Right)
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
            [-1, 1].forEach(dir => {
                const foulLine = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 175.0), lineMat);
                foulLine.rotation.x = -Math.PI / 2;
                foulLine.rotation.z = dir * (Math.PI / 4);
                foulLine.position.set(dir * 61.87, 0.028, -61.87);
                scene.add(foulLine);
            });

            // 3. CONCENTRIC WHITE DISTANCE ARCS EVERY 20m (20m, 40m, 60m, 80m, 100m, 120m, 140m, 160m)
            // Exactly replicating the crisp white curved distance rings visible in the reference video!
            const arcMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.78,
                side: THREE.DoubleSide
            });

            [20, 40, 60, 80, 100, 120, 140, 160].forEach(distM => {
                const arcGeo = new THREE.RingGeometry(distM - 0.16, distM + 0.16, 96, 1, Math.PI * 0.24, Math.PI * 0.52);
                const arcMesh = new THREE.Mesh(arcGeo, arcMat);
                arcMesh.rotation.x = -Math.PI / 2;
                arcMesh.position.set(0, 0.032, 0);
                scene.add(arcMesh);

                // Painted distance marker badge on center-right & center-left of each arc
                const labelTex = createDistanceLabelTexture(`${distM}m`);
                const labelMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(4.6, 1.75),
                    new THREE.MeshBasicMaterial({ map: labelTex, transparent: true, depthWrite: false })
                );
                labelMesh.rotation.x = -Math.PI / 2;
                labelMesh.position.set(0, 0.036, -distM);
                scene.add(labelMesh);
            });

            // 4. Curved Ivy-Covered Koshien Outfield Wall (95m corners -> 118m center)
            const ivyTex = createIvyWallTexture();
            const wallGeo = new THREE.BufferGeometry();
            const positions = [];
            const uvs = [];
            const indices = [];
            const segs = 72;
            const wallH = 4.2;

            for (let i = 0; i <= segs; i++) {
                const u = i / segs;
                const theta = -Math.PI * 0.25 + (Math.PI * 0.5) * u;
                const r = getWallRadiusAtAngle(theta);
                const wx = Math.sin(theta) * r;
                const wz = -Math.cos(theta) * r;

                positions.push(wx, 0, wz);
                uvs.push(u, 0);
                positions.push(wx, wallH, wz);
                uvs.push(u, 1);

                if (i < segs) {
                    const base = i * 2;
                    indices.push(base, base + 1, base + 2);
                    indices.push(base + 1, base + 3, base + 2);
                }
            }
            wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            wallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            wallGeo.setIndex(indices);
            wallGeo.computeVertexNormals();

            const wallMesh = new THREE.Mesh(
                wallGeo,
                new THREE.MeshLambertMaterial({ map: ivyTex, side: THREE.DoubleSide })
            );
            scene.add(wallMesh);

            // Tall Yellow Foul Poles
            const poleMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            [-1, 1].forEach(dir => {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 18, 12), poleMat);
                pole.position.set(dir * 67.18, 9, -67.18);
                scene.add(pole);
            });

            // 5. Center-Field Koshien Backscreen Scoreboard
            scoreboardCanvas = document.createElement('canvas');
            scoreboardCanvas.width = 640;
            scoreboardCanvas.height = 320;
            scoreboardCtx = scoreboardCanvas.getContext('2d');
            scoreboardTexture = new THREE.CanvasTexture(scoreboardCanvas);

            const boardFrame = new THREE.Mesh(
                new THREE.BoxGeometry(36, 16.5, 2.6),
                new THREE.MeshLambertMaterial({ color: 0x064e3b })
            );
            boardFrame.position.set(0, 12.5, -122.5);
            scene.add(boardFrame);

            const boardScreen = new THREE.Mesh(
                new THREE.PlaneGeometry(33.5, 14.5),
                new THREE.MeshBasicMaterial({ map: scoreboardTexture })
            );
            boardScreen.position.set(0, 12.5, -121.1);
            scene.add(boardScreen);
            update3DScoreboard();

            // 6. Koshien Alps Stands & Animated 3D Spectators
            const concreteMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
            [-1, 1].forEach(side => {
                const alps = new THREE.Mesh(new THREE.BoxGeometry(58, 12, 18), concreteMat);
                alps.position.set(side * 42, 6, -34);
                alps.rotation.y = side * (Math.PI / 4);
                scene.add(alps);

                const rad = side * (Math.PI / 4);
                for (let row = 0; row < 10; row++) {
                    const yPos = 1.8 + row * 0.95;
                    const rowOffset = row * 1.35;
                    for (let k = -24; k <= 24; k += 1.6) {
                        const localX = side * (32 + rowOffset);
                        const localZ = -34;
                        crowdData.push({
                            x: localX + k * Math.cos(rad),
                            y: yPos,
                            z: localZ + k * Math.sin(rad),
                            angle: side * (Math.PI / 4),
                            section: side === 1 ? 'home' : 'away',
                            phase: k * 0.25 + row * 0.3
                        });
                    }
                }
            });

            if (crowdData.length > 0) {
                crowdBodyInstanced = new THREE.InstancedMesh(
                    new THREE.CylinderGeometry(0.24, 0.28, 0.55, 8),
                    new THREE.MeshLambertMaterial({ color: 0xffffff }),
                    crowdData.length
                );
                crowdHeadInstanced = new THREE.InstancedMesh(
                    new THREE.SphereGeometry(0.21, 8, 8),
                    new THREE.MeshLambertMaterial({ color: 0xfdd5b1 }),
                    crowdData.length
                );
                crowdPropInstanced = new THREE.InstancedMesh(
                    new THREE.BoxGeometry(0.14, 0.34, 0.14),
                    new THREE.MeshBasicMaterial({ color: 0xffffff }),
                    crowdData.length
                );
                scene.add(crowdBodyInstanced, crowdHeadInstanced, crowdPropInstanced);
                updateSpectatorColors();
            }

            // 7. Summer Cumulus Clouds
            cloudsGroup = new THREE.Group();
            const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
            for (let i = 0; i < 8; i++) {
                const cGroup = new THREE.Group();
                for (let b = 0; b < 4; b++) {
                    const puff = new THREE.Mesh(new THREE.SphereGeometry(5 + Math.random() * 3, 10, 8), cloudMat);
                    puff.position.set(b * 4.5, Math.random() * 2, (Math.random() - 0.5) * 3.5);
                    cGroup.add(puff);
                }
                cGroup.position.set(-125 + i * 36, 44 + (i % 3) * 6, -150 - (i % 2) * 18);
                cloudsGroup.add(cGroup);
            }
            scene.add(cloudsGroup);
        }

        function updateSpectatorColors() {
            if (!crowdBodyInstanced || !crowdPropInstanced) return;
            const cBody = new THREE.Color();
            const cProp = new THREE.Color();
            crowdData.forEach((s, i) => {
                if (s.section === 'home') {
                    cBody.set(i % 3 === 0 ? '#ffffff' : state.teamColor);
                    cProp.set(i % 2 === 0 ? '#facc15' : state.teamColor);
                } else {
                    cBody.set(i % 3 === 0 ? '#ffffff' : '#dc2626');
                    cProp.set(i % 2 === 0 ? '#ffffff' : '#dc2626');
                }
                crowdBodyInstanced.setColorAt(i, cBody);
                crowdPropInstanced.setColorAt(i, cProp);
            });
            if (crowdBodyInstanced.instanceColor) crowdBodyInstanced.instanceColor.needsUpdate = true;
            if (crowdPropInstanced.instanceColor) crowdPropInstanced.instanceColor.needsUpdate = true;
        }

        function update3DScoreboard() {
            if (!scoreboardCtx || !scoreboardTexture) return;
            const ctx = scoreboardCtx;
            ctx.fillStyle = '#064e3b';
            ctx.fillRect(0, 0, 640, 320);

            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 7;
            ctx.strokeRect(10, 10, 620, 300);

            ctx.fillStyle = '#fde047';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('HANSHIN KOSHIEN TOSS DERBY', 320, 48);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(state.schoolName, 320, 108);

            ctx.fillStyle = '#38bdf8';
            ctx.font = '900 44px sans-serif';
            ctx.fillText(`BEST: ${state.bestDistance.toFixed(2)}m`, 320, 182);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText(`HOME RUNS: ${state.homeRunCount}`, 320, 248);

            scoreboardTexture.needsUpdate = true;
        }

        /**

        /**
         * 2-Head SD PowerPro Character Builder (Pinstripe Koshien Uniform + Bat/Glove)
         */
        function createPowerProHeadTexture(hairColor = '#2b1d14') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fdd5b1';
            ctx.fillRect(0, 0, 512, 256);

            ctx.fillStyle = 'rgba(244, 114, 128, 0.28)';
            ctx.beginPath();
            ctx.ellipse(212, 162, 16, 9, 0, 0, Math.PI * 2);
            ctx.ellipse(300, 162, 16, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = hairColor;
            ctx.fillRect(0, 48, 178, 155);
            ctx.fillRect(334, 48, 178, 155);

            ctx.beginPath();
            ctx.moveTo(195, 78);
            ctx.lineTo(222, 102);
            ctx.lineTo(240, 82);
            ctx.lineTo(258, 104);
            ctx.lineTo(276, 82);
            ctx.lineTo(295, 100);
            ctx.lineTo(316, 78);
            ctx.closePath();
            ctx.fill();

            [228, 284].forEach((ex, idx) => {
                const isLeft = idx === 0;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(ex, 136, 17, 19, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1e1b18';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.ellipse(ex + (isLeft ? 2 : -2), 137, 10.5, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex + (isLeft ? -2 : -5), 131, 4.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.ellipse(ex, 135, 18, 19, 0, Math.PI * 1.08, Math.PI * 1.92);
                ctx.stroke();

                ctx.strokeStyle = hairColor;
                ctx.lineWidth = 5.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                if (isLeft) {
                    ctx.moveTo(ex - 16, 108);
                    ctx.lineTo(ex + 14, 115);
                } else {
                    ctx.moveTo(ex - 14, 115);
                    ctx.lineTo(ex + 16, 108);
                }
                ctx.stroke();
            });

            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(244, 176);
            ctx.quadraticCurveTo(256, 172, 268, 176);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function createPinstripeUniformTexture(jerseyHex, numberStr = '4', backName = 'YUUKI', emblem = 'S') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Crisp White Koshien Pinstripe Base (matching video's pinstripe batter uniform!)
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 512, 256);

            ctx.fillStyle = '#1e293b';
            for (let x = 6; x < 512; x += 18) {
                ctx.fillRect(x, 0, 3, 256);
            }

            // Collar & Belt
            ctx.fillStyle = jerseyHex;
            ctx.fillRect(0, 0, 512, 32);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 224, 512, 32);
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(244, 226, 24, 28);

            // Front Chest School Emblem
            ctx.fillStyle = jerseyHex;
            ctx.font = '900 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(emblem, 224, 116);

            // Back Number
            [0, 512].forEach(bx => {
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = jerseyHex;
                ctx.lineWidth = 8;
                ctx.font = '900 112px sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(String(numberStr), bx, 172);
                ctx.fillText(String(numberStr), bx, 172);
            });

            return new THREE.CanvasTexture(canvas);
        }

            const maxTrailPts = 52;

            ribbonGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            ribbonGeo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

            const ribbonMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide,
                vertexShader: `
                    attribute float alpha;
                    varying float vAlpha;
                    void main() {
                        vAlpha = alpha;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying float vAlpha;
                    void main() {
                        gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * 0.88);
                    }
                `
            });
            ribbonMesh = new THREE.Mesh(ribbonGeo, ribbonMat);
            ribbonMesh.frustumCulled = false;
            ribbonMesh.visible = false;
            scene.add(ribbonMesh);

            // Golden Bat Contact Shockwave Ring

            tossPuffParticles = {

            // Turf / Dirt Landing Dust Particles
            const dCount = 36;

            turfDustParticles = {
                points: new THREE.Points(dGeo, new THREE.PointsMaterial({ color: 0x3b332e, size: 0.34, transparent: true, opacity: 0 })),
                vels: Array.from({ length: dCount }, () => new THREE.Vector3()),

        function updateRibbonGeometry() {
            const pts = state.flight.trailPoints;
            if (!ribbonMesh || pts.length < 2) {
                if (ribbonMesh) ribbonMesh.visible = false;
                return;
            }
            ribbonMesh.visible = true;
            const posAttr = ribbonMesh.geometry.attributes.position;
            const alphaAttr = ribbonMesh.geometry.attributes.alpha;
            const maxPts = 52;

            for (let i = 0; i < maxPts; i++) {
                const idx = Math.min(i, pts.length - 1);
                const p = pts[idx];
                const t = i / Math.max(1, pts.length - 1); // 0 at ball head, 1 at tapered tail
                const halfWidth = (1 - t) * 0.14;
                const alpha = Math.pow(1 - t, 1.35);

                // Camera-facing perpendicular offset
                const toCam = new THREE.Vector3().subVectors(camera.position, p).normalize();
                const tangent = idx < pts.length - 1
                    ? new THREE.Vector3().subVectors(p, pts[idx + 1]).normalize()
                    : new THREE.Vector3(0, 0, -1);
                const side = new THREE.Vector3().crossVectors(toCam, tangent).normalize();
                if (side.lengthSq() < 0.001) side.set(1, 0, 0);

                posAttr.setXYZ(i * 2, p.x - side.x * halfWidth, p.y - side.y * halfWidth, p.z - side.z * halfWidth);
                posAttr.setXYZ(i * 2 + 1, p.x + side.x * halfWidth, p.y + side.y * halfWidth, p.z + side.z * halfWidth);
                alphaAttr.setX(i * 2, alpha);
                alphaAttr.setX(i * 2 + 1, alpha);
            }
            posAttr.needsUpdate = true;
            alphaAttr.needsUpdate = true;
        }

        function launchTossBall() {
            state.phase = 'toss_flight';
            state.toss.timer = 0;
            state.toss.duration = 0.86 + Math.random() * 0.08;
            state.toss.machineRecoil = 1.0;

            // Compute exact parabolic velocity from Toss Machine muzzle (0.62, 0.56, 0.02)
            // so the ball peaks around y = 1.68m and passes right through the batter's sweet spot (-0.10, 1.05, -0.04) at t = 0.72 * duration!
            const tSweet = state.toss.duration * 0.72;
            const start = state.toss.startPos;
            const target = new THREE.Vector3(-0.10, 1.05, -0.04);
            const g = 9.81;

            const vx = (target.x - start.x) / tSweet;
            const vz = (target.z - start.z) / tSweet;
            const vy = (target.y - start.y + 0.5 * g * tSweet * tSweet) / tSweet;

            state.toss.vel.set(vx, vy, vz);
            ballMesh.position.copy(start);
            ballMesh.visible = true;
            ballShadowMesh.position.set(start.x, 0.125, start.z);
            ballShadowMesh.visible = true;

            audio.playTossLaunch();
            spawnTossPuff(start);
            setPrompt(true, 'Tap to Swing!', '공이 가슴 높이로 내려올 때 스윙!');
        }

        function triggerOneTapSwing() {
            if (state.swing.active) return;
            state.swing.active = true;
            state.swing.timer = 0;
            state.swing.contactChecked = false;
            audio.playSwingWhoosh();
        }

        function evaluateBatContact() {
            const bPos = ballMesh.position;
            // Hitting zone check: ball must have passed its upward toss arc (or be near peak) and sit within vertical hitting band [0.54m, 1.50m]
            const heightDiff = bPos.y - 1.05; // 0 = dead-center sweet spot
            const absH = Math.abs(heightDiff);

            // Too high (swung way too early while ball is still rising/above shoulders) or too low (already dropped near ankles)
            if (state.toss.timer < state.toss.duration * 0.42 || absH > 0.48) {
                const reason = state.toss.timer < state.toss.duration * 0.55 ? '너무 빨랐어요!' : '타이밍이 늦었어요!';
                showJudgment('MISS!', reason, 'text-slate-200');
                return false;
            }

            // Valid Contact! Calculate sweetness (0.0 to 1.0)
            const sweetness = Math.max(0, 1 - absH / 0.48);
            const isPerfect = sweetness >= 0.80;
            const isGreat = sweetness >= 0.52;

            // Wood bat rewards sweet spot even more, slightly narrower forgiveness
            const batBonus = state.batType === 'wood' ? (isPerfect ? 1.05 : 0.96) : 1.0;

            // Exit velocity (112 km/h to 182 km/h)
            const exitVelKmh = (114 + sweetness * 66) * batBonus;
            const exitSpeedMs = exitVelKmh / 3.6;

            // Launch angle & Spray angle driven by contact height & timing!
            // Early/High contact -> Pulled left (-spray) & higher arc
            // Sweet-Spot contact -> Optimal 30-35 deg backspin drive straightaway
            // Late/Low contact -> Pushed right (+spray) & lower line drive / grounder
            let launchAngleDeg;
            let sprayAngleDeg;
            let spinRate;

            if (isPerfect) {
                launchAngleDeg = 30.5 + (Math.random() - 0.5) * 4.5;
                sprayAngleDeg = (Math.random() - 0.5) * 10;
                spinRate = 2450;
                showJudgment('PERFECT!!', '완벽한 스윗스팟 홈런 타구!', 'text-amber-300');
            } else if (heightDiff > 0) {
                // High / Early -> Pulled left / high fly
                const ratio = Math.min(1, heightDiff / 0.48);
                launchAngleDeg = 34 + ratio * 22;
                sprayAngleDeg = -8 - ratio * 26;
                spinRate = 1900;
                showJudgment(isGreat ? 'GREAT!' : 'HIGH FLY', isGreat ? '좌중간 큰 타구!' : '높게 뜬 플라이 타구', isGreat ? 'text-cyan-300' : 'text-sky-200');
            } else {
                // Low / Late -> Pushed right / line drive or grounder
                const ratio = Math.min(1, Math.abs(heightDiff) / 0.48);
                launchAngleDeg = 24 - ratio * 26; // down to -2 deg grounder
                sprayAngleDeg = 8 + ratio * 26;
                spinRate = 1650;
                showJudgment(isGreat ? 'LINE DRIVE!' : 'GROUNDER', isGreat ? '우중간 날카로운 라인드라이브!' : '내야를 가르는 땅볼 타구', isGreat ? 'text-emerald-300' : 'text-amber-200');
            }

            const elevRad = THREE.MathUtils.degToRad(launchAngleDeg);
            const sprayRad = THREE.MathUtils.degToRad(sprayAngleDeg);
            const horizSpeed = exitSpeedMs * Math.cos(elevRad);

            state.flight.timer = 0;
            state.flight.pos.set(-0.08, bPos.y, -0.04);
            state.flight.vel.set(
                horizSpeed * Math.sin(sprayRad),
                exitSpeedMs * Math.sin(elevRad),
                -horizSpeed * Math.cos(sprayRad)
            );
            state.flight.spinRate = spinRate;
            state.flight.bounces = 0;
            state.flight.landed = false;
            state.flight.isHomeRun = false;
            state.flight.hrCelebrated = false;
            state.flight.exitVelKmh = Math.round(exitVelKmh);
            state.flight.launchAngleDeg = Math.round(launchAngleDeg);
            state.flight.trailPoints = [state.flight.pos.clone()];

            // Setup Defense Fielder Pursuit if in 'defense' mode
            setupDefenseRetriever();

            // Hitstop & Impact Visuals
            state.hitstopTimer = isPerfect ? 0.045 : 0.022;
            impactRingMesh.position.copy(state.flight.pos);
            impactRingMesh.scale.setScalar(0.5);
            impactRingMesh.material.opacity = 0.95;

            audio.playBatHit(sweetness, state.batType === 'wood');
            if (launchAngleDeg > 18) audio.playSkyWind(1.2);

            setPrompt(false);
            const pill = document.getElementById('hud-telemetry-pill');
            document.getElementById('hud-telemetry-text').textContent = `타구속도 ${state.flight.exitVelKmh}km/h · 발사각 ${state.flight.launchAngleDeg}°`;
            pill.classList.remove('hidden');

            state.phase = 'ball_flight';
            return true;
        }

        function setupDefenseRetriever() {
            state.defense.ballFielded = false;
            state.defense.relayInFlight = false;
            state.defense.relayProgress = 0;

            // Predict approximate landing zone to pick the nearest fielder
            const estRange = Math.min(115, (state.flight.exitVelKmh / 3.6) * 1.9);
            const dir = new THREE.Vector3(state.flight.vel.x, 0, state.flight.vel.z).normalize();
            const estX = dir.x * estRange;
            const estZ = dir.z * estRange;

            let bestIdx = 6;
            let bestD = Infinity;
            FIELDER_SPOTS.forEach((spot, i) => {
                const d = Math.hypot(estX - spot.vec.x, estZ - spot.vec.z);
                if (d < bestD) {
                    bestD = d;
                    bestIdx = i;
                }
            });
            state.defense.retrieverIdx = bestIdx;
        }

        function handlePrimaryAction() {
            audio.ensureCtx();
            if (!document.getElementById('customize-modal').classList.contains('hidden')) return;

            if (state.phase === 'ready_start') {
                launchTossBall();
            } else if (state.phase === 'toss_flight') {
                triggerOneTapSwing();
            } else if (state.phase === 'result_ready') {
                resetToTossReady(true);
            }
        }

        /**
         * ============================================================================
         * 5. AERODYNAMIC SIMULATION & BALL-CHASE CAMERA LOOP
         * ============================================================================
         */
        function stepSimulation(dt, elapsed) {
            // 1. Toss Machine Recoil & Batter Swing Animation
            if (tossMachine3D && state.toss.machineRecoil > 0) {
                state.toss.machineRecoil = Math.max(0, state.toss.machineRecoil - dt * 5.0);
                tossMachine3D.userData.bodyPivot.position.y = 0.24 - Math.sin(state.toss.machineRecoil * Math.PI) * 0.04;
            }

            if (state.swing.active) {
                state.swing.timer += dt;
                const p = Math.min(1, state.swing.timer / state.swing.duration);
                // Fast forward snap + smooth follow-through
                const swingCurve = p < 0.45 ? Math.sin((p / 0.45) * (Math.PI / 2)) : 1.0 - (p - 0.45) * 0.25;
                batter3D.torso.rotation.y = -Math.PI / 2 + swingCurve * 1.45;
                batter3D.rightHandPivot.rotation.y = swingCurve * 2.05;
                batter3D.leftHandPivot.rotation.y = swingCurve * 1.75;

                // Evaluate bat-ball contact right as bat sweeps through the hitting plane
                if (!state.swing.contactChecked && p >= 0.14 && p <= 0.42 && state.phase === 'toss_flight') {
                    state.swing.contactChecked = true;
                    evaluateBatContact();
                }

                if (p >= 1.0) {
                    state.swing.active = false;
                }
            } else if (state.phase === 'ready_start' || state.phase === 'toss_flight') {
                batter3D.torso.rotation.y = THREE.MathUtils.lerp(batter3D.torso.rotation.y, -Math.PI / 2, dt * 10);
                batter3D.rightHandPivot.rotation.y = THREE.MathUtils.lerp(batter3D.rightHandPivot.rotation.y, 0, dt * 10);
                batter3D.leftHandPivot.rotation.y = THREE.MathUtils.lerp(batter3D.leftHandPivot.rotation.y, 0, dt * 10);
            }

            // 2. Toss Ball Parabolic Flight
            if (state.phase === 'toss_flight') {
                state.toss.timer += dt;
                state.toss.vel.y -= 9.81 * dt;
                ballMesh.position.addScaledVector(state.toss.vel, dt);
                ballMesh.rotation.z += dt * 12;
                ballShadowMesh.position.set(ballMesh.position.x, 0.125, ballMesh.position.z);

                // If ball drops below the platform without being hit -> Miss / Reset for next toss
                if (ballMesh.position.y <= 0.20 && state.toss.vel.y < 0) {
                    if (!state.swing.contactChecked) {
                        showJudgment('MISS!', '스윙하지 않았습니다', 'text-slate-300');
                    }
                    ballMesh.visible = false;
                    ballShadowMesh.visible = false;
                    state.phase = 'ready_start';
                    setPrompt(true, 'Tap to Swing!', '다음 토스 준비 완료 · 클릭 / SPACE');
                }
            }

            // 3. Struck Ball Aerodynamic Flight (Drag + Backspin Magnus Lift + Turf Bounce/Roll)
            if (state.phase === 'ball_flight') {
                const fl = state.flight;
                fl.timer += dt;

                if (!fl.landed) {
                    const subSteps = 4;
                    const subDt = dt / subSteps;
                    const dragCoeff = 0.0054;
                    const magnusCoeff = 0.000018;

                    for (let s = 0; s < subSteps; s++) {
                        const speed = fl.vel.length();
                        if (speed > 0.01) {
                            // Quadratic aerodynamic drag
                            const dragMag = dragCoeff * speed * speed;
                            const axDrag = -(fl.vel.x / speed) * dragMag;
                            const ayDrag = -(fl.vel.y / speed) * dragMag;
                            const azDrag = -(fl.vel.z / speed) * dragMag;

                            // Backspin Magnus lift perpendicular to velocity
                            const horizSpd = Math.hypot(fl.vel.x, fl.vel.z);
                            const liftMag = magnusCoeff * fl.spinRate * horizSpd;
                            const ayMagnus = liftMag;

                            fl.vel.x += axDrag * subDt;
                            fl.vel.y += (ayDrag + ayMagnus - 9.81) * subDt;
                            fl.vel.z += azDrag * subDt;
                        }

                        fl.pos.addScaledVector(fl.vel, subDt);

                        // Ground Collision & Turf Rolling Physics
                        if (fl.pos.y <= 0.07 && fl.vel.y < 0) {
                            fl.pos.y = 0.07;
                            if (fl.bounces === 0 && !fl.isHomeRun) {
                                spawnTurfDust(fl.pos);
                            }
                            fl.bounces++;
                            const isInDirt = Math.hypot(fl.pos.x, fl.pos.z + 20.5) < 34.5;
                            const restitution = isInDirt ? 0.44 : 0.36;
                            const bounceDrag = isInDirt ? 0.80 : 0.72;

                            if (Math.abs(fl.vel.y) > 1.1) {
                                fl.vel.y = -fl.vel.y * restitution;
                            } else {
                                fl.vel.y = 0;
                            }
                            fl.vel.x *= bounceDrag;
                            fl.vel.z *= bounceDrag;
                        }

                        // Rolling friction when skimming the grass/dirt
                        if (fl.pos.y <= 0.08 && Math.abs(fl.vel.y) < 0.2) {
                            const rollDecel = 5.2 * subDt;
                            const hSpd = Math.hypot(fl.vel.x, fl.vel.z);
                            if (hSpd > rollDecel) {
                                const scale = (hSpd - rollDecel) / hSpd;
                                fl.vel.x *= scale;
                                fl.vel.z *= scale;
                            } else {
                                fl.vel.x = 0;
                                fl.vel.z = 0;
                            }
                        }
                    }

                    // Update Ball Mesh, Shadow & Aerodynamic Ribbon Trail
                    ballMesh.position.copy(fl.pos);
                    ballMesh.rotation.x -= dt * 36;
                    ballShadowMesh.position.set(fl.pos.x, 0.04, fl.pos.z);

                    fl.trailPoints.unshift(fl.pos.clone());
                    if (fl.trailPoints.length > 52) fl.trailPoints.pop();
                    updateRibbonGeometry();

                    // Live Distance Counter Update (`0.00m` -> `162.87m`)
                    const distM = Math.hypot(fl.pos.x, fl.pos.z);
                    state.currentDistance = distM;
                    document.getElementById('hud-live-distance').textContent = `${distM.toFixed(2)}m`;
                    if (distM > state.bestDistance) {
                        saveBestDistance(distM);
                    }

                    // Check Koshien Home Run Fence Clearance (95m corners -> 118m center)
                    const sprayTheta = Math.atan2(fl.pos.x, -fl.pos.z);
                    const isFairAngle = Math.abs(sprayTheta) <= Math.PI * 0.255;
                    const fenceDist = getWallRadiusAtAngle(THREE.MathUtils.clamp(sprayTheta, -Math.PI * 0.25, Math.PI * 0.25));

                    if (!fl.hrCelebrated && isFairAngle && distM >= fenceDist && fl.pos.y >= 3.2) {
                        fl.isHomeRun = true;
                        fl.hrCelebrated = true;
                        state.homeRunCount++;
                        document.getElementById('badge-hit-count').textContent = `홈런 ${state.homeRunCount}개`;
                        state.crowdWaveTimer = 2.4;
                        audio.playHomeRunCelebration();
                        spawnHomeRunFireworks();
                        update3DScoreboard();
                        showJudgment('HOME RUN!!', '고시엔 담장을 넘어가는 초대형 홈런!', 'text-amber-300');
                    }

                    // Optional Koshien Defense Mode: Nearest Fielder Sprints to Ball
                    if (state.gameMode === 'defense' && !fl.isHomeRun) {
                        const f = fielders3D[state.defense.retrieverIdx];
                        if (f) {
                            const dx = fl.pos.x - f.root.position.x;
                            const dz = fl.pos.z - f.root.position.z;
                            const d = Math.hypot(dx, dz);
                            if (d > 0.4) {
                                const step = Math.min(d, 8.6 * dt);
                                f.root.position.x += (dx / d) * step;
                                f.root.position.z += (dz / d) * step;
                                f.root.lookAt(fl.pos.x, 0, fl.pos.z);
                                const stride = Math.sin(fl.timer * 24) * 0.18;
                                f.leftFoot.position.z = stride;
                                f.rightFoot.position.z = -stride;
                            } else if (fl.bounces >= 1 && !state.defense.ballFielded) {
                                // Fielder scoops ball & stops it cleanly
                                state.defense.ballFielded = true;
                                fl.vel.set(0, 0, 0);
                                audio.playFielderGlovePop();
                                const spot = FIELDER_SPOTS[state.defense.retrieverIdx];
                                showJudgment(`${spot.pos} 포구!`, `${spot.name} 야수가 타구를 처리했습니다`, 'text-sky-300');
                            }
                        }
                    }

                    // Check if ball has come to rest
                    if (fl.pos.y <= 0.085 && fl.vel.length() < 0.25 && fl.timer > 0.45) {
                        fl.landed = true;
                        update3DScoreboard();
                        state.phase = 'result_ready';
                        document.getElementById('next-btn').classList.remove('hidden');
                        document.getElementById('next-btn').classList.add('animate-next-btn');
                    }
                }
            }

            // 4. Camera Controller: Holds on Batter for 0.25s post-hit, then Smoothly Tracks Behind Ball!
            let desiredPos = HOME_CAM_POS;
            let desiredLook = HOME_CAM_LOOK;

            if (state.phase === 'ball_flight' || state.phase === 'result_ready') {
                if (state.flight.timer >= 0.25) {
                    const bPos = state.flight.pos;
                    const hVel = new THREE.Vector3(state.flight.vel.x, 0, state.flight.vel.z);
                    const flightDir = hVel.lengthSq() > 0.05
                        ? hVel.normalize()
                        : new THREE.Vector3(bPos.x, 0, bPos.z).normalize();
                    if (flightDir.lengthSq() < 0.01) flightDir.set(0, 0, -1);

                    // Chase Camera positioned behind and slightly above the ball, tilting down to frame the ball + white trail + concentric distance rings
                    desiredPos = new THREE.Vector3(
                        bPos.x - flightDir.x * 5.6,
                        Math.max(2.1, bPos.y + 2.7),
                        bPos.z - flightDir.z * 5.6
                    );
                    desiredLook = new THREE.Vector3(
                        bPos.x + flightDir.x * 13.5,
                        Math.max(0.2, bPos.y - 3.4),
                        bPos.z + flightDir.z * 13.5
                    );
                }
            }

            const lerpFactor = (state.phase === 'ready_start' || state.phase === 'toss_flight')
                ? Math.min(1, dt * 9.0)
                : Math.min(1, dt * 6.2);
            camCurrentPos.lerp(desiredPos, lerpFactor);
            camCurrentLook.lerp(desiredLook, lerpFactor);
            camera.position.copy(camCurrentPos);
            camera.lookAt(camCurrentLook);

            // 5. Impact Ring, Particles, Clouds & Animated Koshien Alps Spectators
            if (impactRingMesh && impactRingMesh.material.opacity > 0) {
                impactRingMesh.scale.addScalar(dt * 14);
                impactRingMesh.material.opacity = Math.max(0, impactRingMesh.material.opacity - dt * 2.8);
            }

            [tossPuffParticles, turfDustParticles].forEach(sys => {
                if (sys && sys.life > 0) {
                    sys.life -= dt;
                    sys.points.material.opacity = Math.max(0, sys.life * 1.1);
                    const attr = sys.points.geometry.attributes.position;
                    for (let i = 0; i < attr.count; i++) {
                        sys.vels[i].y -= 6.0 * dt;
                        attr.setXYZ(
                            i,
                            attr.getX(i) + sys.vels[i].x * dt,
                            Math.max(0.05, attr.getY(i) + sys.vels[i].y * dt),
                            attr.getZ(i) + sys.vels[i].z * dt
                        );
                    }
                    attr.needsUpdate = true;
                }
            });

            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                const fw = fireworkParticles[i];
                fw.life -= dt;
                fw.points.material.opacity = Math.max(0, fw.life / 1.6);
                const attr = fw.points.geometry.attributes.position;
                for (let j = 0; j < attr.count; j++) {
                    fw.vels[j].y -= 4.2 * dt;
                    attr.setXYZ(
                        j,
                        attr.getX(j) + fw.vels[j].x * dt,
                        attr.getY(j) + fw.vels[j].y * dt,
                        attr.getZ(j) + fw.vels[j].z * dt
                    );
                }
                attr.needsUpdate = true;
                if (fw.life <= 0) {
                    scene.remove(fw.points);
                    fireworkParticles.splice(i, 1);
                }
            }

            if (cloudsGroup) {
                cloudsGroup.children.forEach((c, idx) => {
                    c.position.x += dt * (0.65 + (idx % 3) * 0.2);
                    if (c.position.x > 165) c.position.x = -165;
                });
            }

            if (state.crowdWaveTimer > 0) state.crowdWaveTimer -= dt;
            if (crowdBodyInstanced && crowdHeadInstanced && crowdPropInstanced && crowdData.length > 0) {
                const dummy = new THREE.Object3D();
                const isWave = state.crowdWaveTimer > 0;
                for (let i = 0; i < crowdData.length; i++) {
                    const s = crowdData[i];
                    const bounce = isWave
                        ? Math.max(0, Math.sin(s.x * 0.25 - elapsed * 9.5)) * 0.45
                        : Math.abs(Math.sin(elapsed * 4.8 + s.phase)) * 0.14;

                    dummy.position.set(s.x, s.y + bounce, s.z);
                    dummy.rotation.set(0, -s.angle, 0);
                    dummy.updateMatrix();
                    crowdBodyInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.position.set(s.x, s.y + 0.44 + bounce, s.z);
                    dummy.updateMatrix();
                    crowdHeadInstanced.setMatrixAt(i, dummy.matrix);

                    const pump = Math.sin(elapsed * 8.0 + s.phase) * 0.14;
                    dummy.position.set(s.x + 0.16, s.y + 0.48 + bounce + pump, s.z);
                    dummy.rotation.set(0, -s.angle, pump * 2.0);
                    dummy.updateMatrix();
                    crowdPropInstanced.setMatrixAt(i, dummy.matrix);
                }
                crowdBodyInstanced.instanceMatrix.needsUpdate = true;
                crowdHeadInstanced.instanceMatrix.needsUpdate = true;
                crowdPropInstanced.instanceMatrix.needsUpdate = true;
            }
        }

        /**
         * ============================================================================
         * 6. INPUT LISTENERS, RESIZE & MAIN RENDER LOOP
         * ============================================================================
         */
        function bindEvents() {
            const wrapper = document.getElementById('canvas-wrapper');

            wrapper.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button')) return;
                handlePrimaryAction();
            });

            document.getElementById('next-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                audio.ensureCtx();
                resetToTossReady(true);
            });

            document.getElementById('mode-toggle-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                state.gameMode = state.gameMode === 'toss' ? 'defense' : 'toss';
                document.getElementById('mode-label').textContent = state.gameMode === 'toss' ? '토스 배팅' : '고시엔 수비연출';
                fielders3D.forEach((f, idx) => {
                    f.root.visible = (state.gameMode === 'defense');
                    f.root.position.copy(FIELDER_SPOTS[idx].vec);
                });
            });

            document.getElementById('mute-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const muted = audio.toggleMute();
                document.getElementById('mute-icon').textContent = muted ? '🔇' : '🔊';
            });

            // Customization Modal
            const modal = document.getElementById('customize-modal');
            document.getElementById('customize-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                modal.classList.remove('hidden');
            });
            document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('school-name-input').value = btn.dataset.preset;
                    state.capEmblem = btn.dataset.emblem;
                });
            });

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-btn').forEach(b => {
                        b.className = 'color-btn h-9 rounded-xl opacity-75 hover:opacity-100 transition cursor-pointer';
                        b.style.backgroundColor = b.dataset.color;
                    });
                    btn.className = 'color-btn h-9 rounded-xl ring-2 ring-white scale-105 transition cursor-pointer';
                    state.teamColor = btn.dataset.color;
                });
            });

            document.querySelectorAll('.bat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.bat-btn').forEach(b => {
                        b.className = 'bat-btn p-2.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:border-slate-500 text-left transition cursor-pointer';
                    });
                    btn.className = 'bat-btn p-2.5 rounded-xl border-2 border-amber-400 bg-amber-400/15 text-left transition cursor-pointer';
                    state.batType = btn.dataset.bat;
                });
            });

            document.getElementById('reset-best-btn').addEventListener('click', () => {
                state.bestDistance = 0;
                state.homeRunCount = 0;
                document.getElementById('hud-best-distance').textContent = '0.00m';
                document.getElementById('badge-hit-count').textContent = '홈런 0개';
                try { localStorage.removeItem(STORAGE_KEY_BEST); } catch (e) {}
                update3DScoreboard();
            });

            document.getElementById('apply-modal-btn').addEventListener('click', () => {
                const name = document.getElementById('school-name-input').value.trim();
                state.schoolName = name || '세이도 고교';
                document.getElementById('badge-school-name').textContent = state.schoolName;
                document.getElementById('badge-school-color').style.backgroundColor = state.teamColor;
                if (batter3D) batter3D.updateAppearance(state.teamColor, state.capEmblem, state.batType === 'wood');
                updateSpectatorColors();
                update3DScoreboard();
                modal.classList.add('hidden');
            });

            // Keyboard Space / Enter
            window.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('hidden')) return;
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    handlePrimaryAction();
                }
            });

            window.addEventListener('resize', () => {
                if (!renderer || !camera) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight, false);
            });
        }

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const rawDt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            if (state.hitstopTimer > 0) {
                state.hitstopTimer -= rawDt;
                if (threeReady && renderer && scene && camera) renderer.render(scene, camera);
                return;
            }

            if (threeReady) {
                stepSimulation(rawDt, now / 1000);
                renderer.render(scene, camera);
            }
        }

        window.onload = function () {
            document.getElementById('hud-best-distance').textContent = `${state.bestDistance.toFixed(2)}m`;
            initThreeScene();
            bindEvents();
            resetToTossReady(false);
            requestAnimationFrame(animate);
        };
    </script>
